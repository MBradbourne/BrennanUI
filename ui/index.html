    const m = /(\d+)\s*(?:\/|of)\s*(\d+)(?:\D+(\d+(?:\.\d+)?)\s*%)?/i.exec(clean(t||''));
    if (m && /rip/i.test(t)) { const n=+m[1], of=+m[2], pct=m[3]!=null?+m[3]:null;
      return { n, of, pct, overall: of ? Math.min(100, ((n-1) + (pct??0)/100) / of * 100) : null }; }
  }
  return null;
}
function cdStatusText(st){
  const a = clean(st.cdstatus||''), b = clean(st.background||'');

  const norm = x => x.toLowerCase().replace(/ripping/g,'rip').replace(/[^a-z0-9%/]+/g,' ').trim();
  if (norm(a)===norm(b) || norm(b).includes(norm(a)) || norm(a).includes(norm(b))) return a.length>=b.length ? a : b;
  return a + ' — ' + b;
}

const asciiPunct = t => String(t||'').replace(/[‘’‚′]/g,"'").replace(/[“”„″]/g,'"')
  .replace(/[–—−]/g,'-').replace(/…/g,'...').replace(/[  -​]/g,' ').replace(/[\u0000-\u001F\u007F]/g,'').trim();
async function ripCD(){
  const c=cdCurrent(); const m=c.m;
  if (!c.artist.trim() || !c.album.trim()) return toast('Add an artist and album name first');
  if (isRipping(S.status)) return toast('Already ripping');
  // Send exactly the shape the Brennan's own page sends (its getCDDB record: artist, album, art,
  // tracks), with one name per track ON THE DISC. The Brennan's lookup always reflects the
  // disc's real track count; MusicBrainz media can differ (data tracks, other pressings).
  const brennanMatch = S.cd.matches.find(x=>x._raw);
  const n = brennanMatch ? brennanMatch.tracks.length : (c.tracks.length || m?.tracks.length || 0);
  const names = c.tracks.length ? c.tracks : (m?.tracks || []);
  const tracks = Array.from({length:n}, (_,i)=> asciiPunct(names[i]) || `Track ${i+1}`);
  const base = m?._raw || brennanMatch?._raw || {};
  const meta = { artist: asciiPunct(c.artist), album: asciiPunct(c.album),
                 art: typeof base.art==='string' ? base.art : '', tracks };
  // A cover you picked is applied after the rip finishes (same path as Find artwork), rather
  // than handed to the Brennan mid-rip.
  S.cd.pendingArt = c.art && c.art !== base.art ? { url:c.art, artist:meta.artist, album:meta.album } : null;
  try { localStorage.setItem('brennan.cdPendingArt', JSON.stringify(S.cd.pendingArt)); } catch {}
  S.cd.sent = true; updateCdStatus();
  try {
    const fd = new FormData(); fd.append('rip', JSON.stringify(meta));
    const r = await fetch('/api?newRip', {method:'POST', body: fd});
    if (!r.ok) throw new Error('HTTP '+r.status);
    toast(`Ripping “${meta.album}”…`);
  } catch(e){ S.cd.sent=false; updateCdStatus(); return toast('The Brennan didn’t accept the rip: '+e.message); }
  setTimeout(()=>{ if (!isRipping(S.status)) { S.cd.sent=false; updateCdStatus(); } }, 15000);
}

/* ---- Level meter ----
   status.vu is NOT ten frequency bands: it's the last ten level readings (newest first, about
   one every 100 ms). We only poll once a second, so we queue the new readings and play them
   back at their real pace as a smoothly scrolling area chart (newest on the right). It runs
   ~1 s behind the music, which you can't see. */
const VU_N = 18, VU_W = 280, VU_H = 52;              // 18 points ≈ the last 1.6 s
const VU = { buf:[], hist:Array(VU_N).fill(0), phase:0, last:0, t:0, raf:0, playing:false };
function vuFeed(vu, playing){
  if (L.show.meter===false) return;
  const now=performance.now(), dt = VU.last ? now-VU.last : 1000; VU.last=now;
  VU.playing = !!playing && vu.some(v=>+v>0);
  if (VU.playing){
    const n = Math.max(1, Math.min(vu.length, Math.round(dt/100)));
    VU.buf.push(...vu.slice(0,n).reverse().map(v=>Math.max(0, Math.min(100, +v||0))));
    if (VU.buf.length>30) VU.buf.splice(0, VU.buf.length-30);
  } else VU.buf.length=0;
  if (!VU.raf) { VU.t=now; VU.raf=requestAnimationFrame(vuFrame); }
}
function vuFrame(now){
  const box=$('#npVu'); if (!box) { VU.raf=0; return; }
  const dt=Math.min(100, now-VU.t); VU.t=now;
  const rate = VU.buf.length>16 ? 1.25 : VU.buf.length<4 ? 0.8 : 1;   // keep ~1 poll queued
  VU.phase += dt*rate/100;
  while (VU.phase>=1){ VU.phase-=1;
    VU.hist.push(VU.buf.length ? VU.buf.shift() : VU.hist[VU_N-1]*0.55); VU.hist.shift(); }
  // points: x scrolls left by `phase`; y from the level (top = loud)
  const dx = VU_W/(VU_N-3), pts = VU.hist.map((v,i)=>[(i-1-VU.phase)*dx, VU_H-2 - (VU_H-6)*v/100]);
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i=0;i<pts.length-1;i++){                 // Catmull-Rom → Bézier for a smooth curve
    const p0=pts[Math.max(0,i-1)], p1=pts[i], p2=pts[i+1], p3=pts[Math.min(pts.length-1,i+2)];
    d += `C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  const last = pts[pts.length-1][0].toFixed(1);
  box.querySelector('.vu-line').setAttribute('d', d);
  box.querySelector('.vu-area').setAttribute('d', `${d}L${last},${VU_H}L${pts[0][0].toFixed(1)},${VU_H}Z`);
  const quiet = VU.hist.every(v=>v<1) && !VU.buf.length;
  box.classList.toggle('quiet', quiet);                       // fades out when silent
  if (quiet && !VU.playing) { VU.raf=0; return; }
  VU.raf=requestAnimationFrame(vuFrame);
}
// centre the meter under the transport buttons (shuffle … more), whatever the layout
function placeVu(){
  const box=$('#npVu'), a=$('#npShuffle'), b=$('#npMore'); if (!box||!a||!b) return;
  const parent=box.offsetParent || box.parentElement; box.style.marginLeft='0';
  const pr=box.parentElement.getBoundingClientRect(), ra=a.getBoundingClientRect(), rb=b.getBoundingClientRect();
  if (!ra.width) return;
  const centre=(ra.left+rb.right)/2 - pr.left, w=box.getBoundingClientRect().width;
  box.style.marginLeft = Math.max(0, Math.min(pr.width-w, centre-w/2)).toFixed(0)+'px';
}
addEventListener('resize', ()=>placeVu());

/* ---- Settings ---- */

  let info={}, space=null, dev=null, st={};

      <div class="set"><span class="lab">Graphic equaliser</span><button class="switch ${+st.equaliser?'on':''}" id="sEq" aria-label="Equaliser"></button></div>

/* =========================================================================
   Transport / player bar
   ========================================================================= */
async function transport(cmd){ try { await api(cmd, sonosParam()); setTimeout(poll,250); } catch { toast('Couldn’t reach the Brennan'); } }
function isPlaying(){ return S.output>0 ? !!S.sonosStatus?.playing : !!S.status?.playing; }
function togglePlay(){ transport('play'); }   // `play` toggles play/pause on the unit
// Shuffle belongs to whatever is playing: the Brennan's own setting for its speakers, or the
// Sonos room's play mode when a Sonos room is the output (the Brennan's setting doesn't reach it).
function shuffleOn(){ return S.output>0 ? !!S.sonosPos?.shuffle : !!+S.status?.random; }
async function toggleShuffle(){
  const on = !shuffleOn();
  if (S.output>0) {
    try { await sonosAct('shuffle',{on}); if (S.sonosPos) S.sonosPos.shuffle=on; updateUI(); toast(`Shuffle ${on?'on':'off'} for ${outputName()}`); }
    catch(e){ toast('Couldn’t change shuffle on '+outputName()+': '+e.message); }
    fetchSonosPos(sonosRoom()); upNextSig=null; refreshUpNext(true); return;
  }
  api('setRandom',{random:on?1:0}); S.status && (S.status.random=on?'1':'0'); updateUI(); toast('Shuffle '+(on?'on':'off'));
}
$('#playBtn').onclick=togglePlay; $('#prevBtn').onclick=()=>transport('back'); $('#nextBtn').onclick=()=>transport('next');
$('#shuffleBtn').onclick=toggleShuffle;
$('#surpriseBtn').onclick=surprise;
$('#plNow').onclick=()=>go('now');
$('#sideNp').onclick=()=>go('now');
$('#sortBtn').onclick=e=>{ const st=S.status||{}; openMenu(e.currentTarget,[{label:'Library order'},
  {text:'Alphabetical', on:+st.sorted===1, run:()=>api('setSorted',{sorted:1,reversed:0})},
  {text:'Reverse alphabetical', on:+st.reversed===1, run:()=>api('setSorted',{sorted:0,reversed:1})},
  {text:'As ripped', on:!+st.sorted&&!+st.reversed, run:()=>api('setSorted',{sorted:0,reversed:0})}]); };

function bindSeek(el){
  setRangeFill(el);
  el.addEventListener('input',()=>{ S.seeking=true; setRangeFill(el); const {dur}=trackTimes(S.status||{}); if(dur) { const t=dur*el.value/1000; ['#tIn','#npIn'].forEach(s=>{const x=$(s); if(x) x.textContent=fmt(t);}); } });
  el.addEventListener('change',async()=>{
    if (S.output>0) {
      const {dur}=trackTimes(S.status||{}); const secs=Math.round(dur*el.value/1000);
      try { await sonosAct('seek',{seconds:secs}); if (S.sonosPos) Object.assign(S.sonosPos,{into:secs, at:performance.now()}); } catch(e){ toast('Sonos: '+e.message); }
      fetchSonosPos(sonosRoom());
    } else await api('seek',{pos:el.value}).catch(()=>{});
    setTimeout(()=>S.seeking=false,1200); });
}
bindSeek($('#seek'));

// Volume controls: the player bar and Now Playing each have one; they stay in sync.
let volTimer;
const volRanges = () => [...document.querySelectorAll('.vol-range')];
function sendVolume(v, final){
  S.volDrag = true;
  volRanges().forEach(r=>{ r.value=v; setRangeFill(r); });
  clearTimeout(volTimer);
  volTimer = setTimeout(()=>api('vol'+v, sonosParam()).catch(()=>{}), final?0:60);
  if (final) setTimeout(()=>S.volDrag=false,1500);
}
function openVolumePopover(anchor){
  closeMenus();
  const m=document.createElement('div'); m.className='menu vol-pop';
  m.innerHTML = `<div class="lbl" style="padding:0 0 8px">Volume · ${esc(outputName())}</div><input type="range" class="vol-range" min="0" max="64" value="${volRanges()[0]?.value||0}" aria-label="Volume">`;
  document.body.append(m);
  const r=anchor.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(r.right-m.offsetWidth, innerWidth-m.offsetWidth-8))+'px';
  m.style.top = (r.top - m.offsetHeight - 8 > 8 ? r.top - m.offsetHeight - 8 : r.bottom + 8)+'px';
  menuJustOpened=true; setTimeout(()=>menuJustOpened=false);
  bindVolume(m); setRangeFill(m.querySelector('input')); m.querySelector('input').focus();
}
function bindVolume(root){
  root.querySelectorAll('.vol-range').forEach(r=>{
    if (r.dataset.bound) return; r.dataset.bound=1;
    r.addEventListener('input',()=>sendVolume(r.value,false));
    r.addEventListener('change',()=>sendVolume(r.value,true));
  });
  root.querySelectorAll('.mute-btn').forEach(b=>{
    if (b.dataset.bound) return; b.dataset.bound=1;
    b.onclick=e=>{
      const own = b.parentElement.querySelector('.vol-range');
      // when the window is too narrow to show the slider, the speaker button opens one
      if (!own || own.offsetParent===null) return openVolumePopover(b);
      const cur=+own.value;
      if (cur>0){ S.muteFrom=cur; sendVolume(0,true); } else { sendVolume(S.muteFrom||20,true); S.muteFrom=null; }

}
function openOutputMenu(anchor){
  const st=S.status||{}; const names=st.sonos||[];
  const items=[{label:'Play on'},{text:'Brennan speakers', on:S.output===0, run:()=>setOutput('')}];
  sonosChoices(st).forEach(c=>items.push({text:c.label, on:S.output===c.index, run:()=>setOutput(c.key)}));

function bindOutputButtons(root){ root.querySelectorAll('[data-out]').forEach(b=>{ if(!b.dataset.bound){ b.dataset.bound=1; b.onclick=e=>openOutputMenu(e.currentTarget); } }); }
bindVolume(document); bindOutputButtons(document);
function setOutput(name){ S.outputName=name||''; try{localStorage.setItem('brennan.outputName',S.outputName)}catch{}; resolveOutput(S.status); S.sonosStatus=null; S.volDrag=false; updateUI(); toast('Output: '+outputName()); poll(); refreshUpNext(true); }
function outputName(){ return S.output>0 ? (S.outputLabel || S.outputName.replace(/#\d+$/,'') || 'Sonos') : 'Brennan speakers'; }

document.addEventListener('keydown', e=>{
  if (e.target.matches('input,textarea,select') && e.key!=='Escape') return;
  if (e.key===' '){ e.preventDefault(); togglePlay(); }
  else if (e.key==='/'){ e.preventDefault(); $('#q').focus(); }
  else if ((e.key==='r'||e.key==='R') && !e.metaKey && !e.ctrlKey && !e.altKey){ e.preventDefault(); surprise(); }
  else if (e.key==='ArrowRight' && e.shiftKey) transport('next');
  else if (e.key==='ArrowLeft' && e.shiftKey) transport('back');
});

/* =========================================================================
   Status polling & UI update
   ========================================================================= */
let pollBusy=false, failCount=0;
async function poll(){
  if (pollBusy) return; pollBusy=true;
  try {
    const st = await api('status');
    if (typeof st !== 'object') throw new Error('bad status');
    const prevTrack = S.status?.trackid;
    const prevCd = S.status ? {loaded: !!S.status.cdloaded, ripping: isRipping(S.status)} : null;
    S.status = st; failCount=0;
    cdStatusChanged(prevCd, st);
    if (prevTrack && prevTrack !== st.trackid && S.route.name==='playlists' && !document.querySelector('.menu,.scrim'))
      setTimeout(()=>viewPlaylists({sel:S.route.sel, quiet:true}), 600);
    resolveOutput(st);
    if (S.output>0) {
      const prevTitle = S.sonosStatus?.title;
      S.sonosStatus = await api('sonosStatus',{sonos:S.output-1}).catch(()=>null);
      // the Brennan's status only times its own playback; ask the speaker for its position
      const room = sonosRoom();
      if (S.sonosStatus && (!S.sonosPos || S.sonosPos.room!==room || prevTitle!==S.sonosStatus.title || performance.now()-S.sonosPos.at > 4000)) fetchSonosPos(room);
    } else S.sonosPos = null;
    updateUI();
    if (main.querySelector('.view > h1') && /Can’t reach/.test(main.querySelector('.view > h1').textContent)) render();
  } catch (e) {
    failCount++;
    if (failCount===3) { pollDevice(); if (S.route.name==='now') offlineView(); }
  } finally { pollBusy=false; }
}

function currentArtSrc(st){
  if (S.output>0) return S.sonosStatus?.art || null;
  if (st.source==='Internet Radio') return st.logo || null;
  if (['Hard Disk','SD Card'].includes(st.source) && +st.albumid) return artURL(+st.albumid);
  if (['Hard Disk','SD Card','Youtube'].includes(st.source)) return '/api?getCurrentArt&time='+S.artVersion;
  return null;
}
function describe(st){
  if (S.output>0){ const s=S.sonosStatus||{}; return { title:s.title||'—', artist:s.artist||'', album:s.album||'', source:'Sonos · '+outputName() }; }
  if (st.punchThru) return { title:'Spotify Connect', artist:'', album:'', source:'Spotify' };
  switch (st.source){
    case 'Internet Radio': return { title: st.station || 'Internet Radio', artist: st.radioStatus || '', album:'', source:'Internet Radio' };
    case 'Bluetooth': return { title:'Bluetooth', artist: st.btstatus||'', album:'', source:'Bluetooth' };
    case 'CD Player': return { title: st.track || 'CD', artist:'', album:'', source:'CD Player' };
    case 'Podcast': return { title: st.track || 'Podcast', artist:'', album:'', source:'Podcast' };
    default: return { title: cleanTrack(st.track) || '—', artist: clean(st.artist), album: clean(st.album), source: st.source || '' };
  }
}

function setArt(container, src, key, cacheKeyName){
  if (!container) return;
  if (container.dataset.key === key) return;
  container.dataset.key = key;
  container.innerHTML = placeholder(key||'');
  if (!src) return;
  const img = new Image(); img.alt=''; img.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover';
  img.onload = () => { container.append(img); if (cacheKeyName==='np') { const bg=$('#npBg'); if(bg){ bg.style.backgroundImage=`url("${src}")`; bg.classList.add('ok'); } } if (cacheKeyName) pickAccent(img); };
  img.src = src;
}

function pickAccent(img){
  if (ACCENTS[L.accent]) return applyFixedAccent();
  try {
    const c=document.createElement('canvas'); c.width=c.height=24; const x=c.getContext('2d');
    x.drawImage(img,0,0,24,24); const d=x.getImageData(0,0,24,24).data;
    let best=null, bestScore=-1;
    for (let i=0;i<d.length;i+=4){
      const r=d[i],g=d[i+1],b=d[i+2]; const mx=Math.max(r,g,b), mn=Math.min(r,g,b); const sat=mx?(mx-mn)/mx:0, lum=(mx+mn)/510;
      const score = sat*(1-Math.abs(lum-.55)*1.6);
      if (score>bestScore){ bestScore=score; best=[r,g,b]; }
    }
    if (best && bestScore>.25){
      let [r,g,b]=best; const mx=Math.max(r,g,b);
      // dark theme: brighten so it pops on black; light theme: darken so text stays readable on white
      const target = isLightTheme() ? 135 : 200;
      const k = isLightTheme() ? Math.min(1, target/mx) : Math.max(1, target/mx);
      r=Math.min(255,r*k); g=Math.min(255,g*k); b=Math.min(255,b*k);
      const root=document.documentElement.style;
      root.setProperty('--accent',`rgb(${r|0},${g|0},${b|0})`);
      root.setProperty('--accent-soft',`rgba(${r|0},${g|0},${b|0},${isLightTheme()?.12:.14})`);
      root.setProperty('--accent-ink', isLightTheme() ? '#ffffff' : '#1a1206');
    } else resetAccent();
  } catch { resetAccent(); }
}
function resetAccent(){ const r=document.documentElement.style; r.removeProperty('--accent'); r.removeProperty('--accent-soft'); r.removeProperty('--accent-ink'); applyFixedAccent(); }
// A fixed accent (Settings → Layout & Look) replaces the colour picked from the album art.
function applyFixedAccent(){
  const pair = ACCENTS[L.accent]; if (!pair) return false;
  const hex = isLightTheme() ? pair[1] : pair[0], n=parseInt(hex.slice(1),16), rgb=[n>>16,(n>>8)&255,n&255].join(',');
  const r=document.documentElement.style;
  r.setProperty('--accent', hex); r.setProperty('--accent-soft', `rgba(${rgb},${isLightTheme()?.12:.14})`);
  r.setProperty('--accent-ink', isLightTheme() ? '#ffffff' : '#1a1206');
  return true;
}
/* ---- Layout & Look ----
   Per-browser settings (localStorage 'brennan.layout'), applied as attributes/classes on <html>
   so CSS does the work. The <head> script applies the same thing before first paint. */
function saveLayout(){ try { localStorage.setItem('brennan.layout', JSON.stringify(L)); } catch {} }
function applyLayout(){
  const r=document.documentElement;
  r.dataset.art=L.art; r.dataset.menu=L.menu; r.dataset.density=L.density;
  for (const [k] of SHOW_ITEMS) r.classList.toggle('hide-'+k, L.show[k]===false);
  resetAccent(); S.npArtKey=null; S.lastTrackId=null; S.artVersion++;
  if (S.status) updateUI();
  requestAnimationFrame(()=>{ placeVu(); document.querySelectorAll('input[type=range]').forEach(setRangeFill); });
  upNextSig=''; if (S.route?.name==='now') refreshUpNext(true);
}
function setLayout(patch){ L = { ...L, ...patch, show:{ ...L.show, ...(patch.show||{}) } }; saveLayout(); applyLayout(); }
function resetLayout(){ L = JSON.parse(JSON.stringify(LAYOUT_DEFAULT)); saveLayout(); applyLayout(); }
function layoutBox(){

  const seg=(id,opts,cur)=>`<div class="seg" id="${id}">${opts.map(([v,l])=>`<button data-v="${v}" class="${cur===v?'on':''}">${l}</button>`).join('')}</div>`;
  return `<div class="box" id="layoutBox"><h3>Layout &amp; look</h3><div class="layout-cols"><div>
    <div class="set"><span class="lab">Theme</span><div class="seg" id="themeSeg">${[['dark','Dark'],['light','Light'],['system','Match system']].map(([v,l])=>`<button data-theme="${v}" class="${t===v?'on':''}">${l}</button>`).join('')}</div></div>
    <div class="set"><span class="lab">Accent</span><div class="swatches" id="accentSw">
      <button class="swatch art ${L.accent==='art'?'on':''}" data-a="art" title="Follow the album artwork">From artwork</button>
      ${Object.entries(ACCENTS).map(([k,v])=>`<button class="swatch ${L.accent===k?'on':''}" data-a="${k}" title="${k[0].toUpperCase()+k.slice(1)}" aria-label="${k}" style="background:${isLightTheme()?v[1]:v[0]}"></button>`).join('')}
    </div></div>
    <div class="set"><span class="lab">Artwork size</span>${seg('artSeg',[['s','Small'],['m','Medium'],['l','Large'],['xl','Huge']],L.art)}</div>
    <div class="set"><span class="lab">Menu<span class="note">Phones always use tabs at the bottom</span></span>${seg('menuSeg',[['side','Side'],['top','Top'],['bottom','Bottom']],L.menu)}</div>
    <div class="set"><span class="lab">Density</span>${seg('densSeg',[['comfortable','Comfortable'],['compact','Compact']],L.density)}</div>
    </div><div>
    <div class="set"><span class="lab">Show</span></div>
    <div class="showlist">${SHOW_ITEMS.map(([k,l])=>`<label><span>${l}</span><button class="switch ${L.show[k]!==false?'on':''}" data-show="${k}" aria-label="${l}"></button></label>`).join('')}</div>
    <div class="toolbar" style="margin:14px 0 0;justify-content:flex-end"><button class="btn ghost" id="layoutReset">Reset layout</button></div>
  </div></div></div>`;
}
function bindLayoutBox(){
  const box=$('#layoutBox'); if (!box) return;
  const segPick=(id,key)=>box.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{ box.querySelectorAll('#'+id+' button').forEach(x=>x.classList.toggle('on',x===b)); setLayout({[key]:b.dataset.v}); });
  segPick('artSeg','art'); segPick('menuSeg','menu'); segPick('densSeg','density');
  box.querySelectorAll('#accentSw .swatch').forEach(b=>b.onclick=()=>{ box.querySelectorAll('#accentSw .swatch').forEach(x=>x.classList.toggle('on',x===b)); setLayout({accent:b.dataset.a}); });

  $('#layoutReset').onclick=()=>{ resetLayout(); box.outerHTML=layoutBox(); bindLayoutBox(); toast('Layout reset'); };
}

/* ---- Theme ---- */
function themePref(){ try { return localStorage.getItem('brennan.theme') || 'dark'; } catch { return 'dark'; } }
function isLightTheme(){ return document.documentElement.getAttribute('data-theme') === 'light'; }
const themeMQ = window.matchMedia ? matchMedia('(prefers-color-scheme: light)') : null;
function applyTheme(pref){
  if (pref) { try { localStorage.setItem('brennan.theme', pref); } catch {} }
  pref = pref || themePref();
  const light = pref==='light' || (pref==='system' && themeMQ && themeMQ.matches);
  document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
  // re-derive the album-art accent for the new background
  resetAccent(); S.npArtKey=null; S.lastTrackId=null; S.artVersion++;
  if (S.status) updateUI();
  document.querySelectorAll('input[type=range]').forEach(setRangeFill);
}
if (themeMQ) themeMQ.addEventListener?.('change', ()=>{ if (themePref()==='system') applyTheme(); });

function updateUI(){
  const st=S.status; if(!st) return;
  const d=describe(st), playing=isPlaying();
  document.body.classList.toggle('playing', playing);
  $('#brand').classList.toggle('playing', playing);
  const pi = playing?icon.pause:icon.play;
  if ($('#playBtn').dataset.s!==String(playing)){ $('#playBtn').innerHTML=pi; $('#playBtn').dataset.s=String(playing); }
  $('#plTitle').textContent=d.title; $('#plSub').textContent=[d.artist,d.album].filter(Boolean).join(' — ') || d.source;
  document.title = playing && d.title!=='—' ? `${d.title} · Brennan` : 'Brennan';

  // track change → bump art version
  const tkey = S.output>0 ? 'sonos:'+(S.sonosStatus?.title||'') : (st.source==='Internet Radio' ? 'radio:'+(st.station||'') : 'trk:'+st.trackid);
  if (tkey!==S.lastTrackId){ S.lastTrackId=tkey; S.artVersion++; if (!st.trackid && !S.sonosStatus?.art && !st.logo) resetAccent(); }
  const src=currentArtSrc(st);
  setArt($('#plArt'), src, tkey+'|'+S.artVersion, 'pl');
  const side=$('#sideNp'); side.style.display = src ? 'block' : 'none';
  if (src) setArt(side, src, tkey+'|'+S.artVersion+'s');
  side.style.position='relative'; side.style.aspectRatio='1';

  // shuffle/sort
  [$('#shuffleBtn'), $('#npShuffle')].forEach(b=>b&&b.classList.toggle('on', shuffleOn()));

  // time
  const { dur, into, seekable } = trackTimes(st);
  for (const el of [$('#seek'), $('#npSeek')]){ if(!el) continue; el.disabled=!seekable; if(!S.seeking){ el.value = dur? Math.round(into*1000/dur):0; setRangeFill(el); } }
  if (!S.seeking){ $('#tIn').textContent=fmt(into); }
  $('#tLen').textContent=fmt(dur);

  // volume + output (player bar and Now Playing)
  const vNow = S.output>0 ? Math.min(64, +S.sonosStatus?.volume||0) : +st.volume||0;
  if (!S.volDrag) volRanges().forEach(r=>{ r.value=vNow; setRangeFill(r); });
  const vShown = +(volRanges()[0]?.value||0);
  document.querySelectorAll('.vol-waves').forEach(w=>w.style.opacity = vShown? 1 : .15);
  document.querySelectorAll('.out-name').forEach(n=>n.textContent=outputName());
  document.querySelectorAll('[data-out]').forEach(b=>b.classList.toggle('sonos', S.output>0));

  // now playing view
  if (S.route.name==='now' && $('#np')){
    $('#npTitle').textContent=d.title;
    $('#npSource').textContent = d.source + (playing?'':' · paused') + (st.playlist && st.playlist!=='All Music' && S.output===0 ? ' · '+st.playlist : '');
    const A=$('#npArtist'), B=$('#npAlbum');
    A.innerHTML = d.artist ? (st.artistid && S.output===0 && st.source==='Hard Disk' ? `<a href="#" id="npToArtist">${esc(d.artist)}</a>` : esc(d.artist)) : '';
    B.innerHTML = d.album ? (st.albumid && S.output===0 && st.source==='Hard Disk' ? `<a href="#" id="npToAlbum">${esc(d.album)}</a>` : esc(d.album)) : '';
    $('#npToArtist') && ($('#npToArtist').onclick=e=>{e.preventDefault(); go('artist',{id:+st.artistid})});
    $('#npToAlbum') && ($('#npToAlbum').onclick=e=>{e.preventDefault(); go('album',{id:+st.albumid})});
    if (!S.seeking) $('#npIn').textContent=fmt(into);
    $('#npLeft').textContent='-'+fmt(Math.max(0,dur-into));
    const np=$('#npPlay'); if (np.dataset.s!==String(playing)){ np.innerHTML=pi; np.dataset.s=String(playing); }
    setArt($('#npArt'), src, tkey+'|'+S.artVersion, 'np');
    if (!src){ const bg=$('#npBg'); bg && bg.classList.remove('ok'); }
    vuFeed(st.vu||[], playing);
    $('#npVu').classList.toggle('off', S.output>0);
    placeVu();
    const extra=[]; if (st.recording) extra.push('● Recording'); if (st.cdloaded) extra.push('CD: '+st.cdstatus); if (st.alert) extra.push(st.alert);
    $('#npExtra').textContent = extra.join('  ·  ');
    refreshUpNext(tkey !== S.upNextTrack); S.upNextTrack = tkey;
  }
  markNowPlaying();
}

/* =========================================================================
   Device discovery status (from the local launcher)
   ========================================================================= */
let devTimer;
async function pollDevice(){
  clearTimeout(devTimer);
  let j; try { j = await fetch('/local/device').then(r=>r.json()); } catch { j={state:'offline'}; }
  const el=$('#device'); el.className='device '+j.state;
  const T=$('#devTitle'), sub=$('#devSub');
  const wasFound = S.device?.state==='found', prevIp=S.device?.device?.ip;
  S.device=j;
  if (j.state==='found'){ T.textContent='Brennan connected'; sub.textContent=j.device.ip; $('#brandSub').textContent=(j.device.version||'B3+').replace(/^Version\s+/,'').split(' ')[0]+' · '+j.device.ip; }
  else if (j.state==='scanning'){ T.textContent='Scanning network…'; sub.textContent = j.progress?.total ? `${j.progress.done}/${j.progress.total}` : ''; }
  else if (j.state==='notfound'){ T.textContent='Brennan not found'; sub.textContent='Is it switched on?'; }
  else if (j.state==='offline'){ T.textContent='Launcher not running'; sub.textContent='start brennan.py'; }
  else { T.textContent='Starting…'; sub.textContent=''; }
  if (j.state==='found' && (!wasFound || prevIp!==j.device.ip)) { if (prevIp && prevIp!==j.device.ip) S.cache={artists:null,albums:null,playlists:null,presets:null}; poll(); if (!main.innerHTML || /Can’t reach/.test(main.textContent)) render(); }
  if (j.state==='found' && j.gen) onGeneration(j.gen);
  devTimer=setTimeout(pollDevice, j.state==='found'?5000:1000);
}
async function rescan(){ await fetch('/local/rescan',{method:'POST'}).catch(()=>{}); toast('Scanning the network…'); pollDevice(); }
$('#rescanBtn').onclick=rescan;

/* =========================================================================
   Boot
   ========================================================================= */
(function boot(){
  const h=location.hash.slice(1).split('/'); const name=h[0]||'now', id=+h[1]||undefined;
  const valid=['now','artists','albums','artist','album','playlists','radio','cd','settings','missingart'];
  const start = valid.includes(name)?name:'now';
  S.section = sectionOf(start) || ({artist:'artists', album:'albums', missingart:'albums'}[start]) || 'now';
  go(start, id?{id}:{}, false);
  pollDevice(); poll();
  setInterval(()=>{ if (!document.hidden) poll(); }, 1000);
})();
</script>
