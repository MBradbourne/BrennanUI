<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brennan">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Brennan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23f0a43a' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23f0a43a'/%3E%3C/svg%3E">
<script>
// Apply the saved theme before first paint (no flash). "system" follows the OS setting.
(function(){ var t='dark'; try{ t=localStorage.getItem('brennan.theme')||'dark'; }catch(e){}
  var light = t==='light' || (t==='system' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
  document.documentElement.setAttribute('data-theme', light?'light':'dark');
  // Layout & Look (Settings): applied before first paint too. Kept in sync with LAYOUT_DEFAULT below.
  try { var L=JSON.parse(localStorage.getItem('brennan.layout')||'{}')||{}, r=document.documentElement;
    r.setAttribute('data-art', L.art||'m'); r.setAttribute('data-menu', L.menu||'side'); r.setAttribute('data-density', L.density||'comfortable');
    var sh=L.show||{}; for (var k in sh) if (sh[k]===false) r.classList.add('hide-'+k);
  } catch(e){} })();
</script>
<style>
:root{
  --bg:#0c0d10; --bg-2:#121318; --panel:#16181e; --panel-2:#1c1f27; --line:#262a33;
  --text:#eceef3; --text-2:#a3a8b4; --text-3:#6c7280;
  --accent:#f0a43a; --accent-ink:#1a1206; --accent-soft:rgba(240,164,58,.14);
  --good:#4ccf8a; --warn:#f0c03a; --bad:#ef6461;
  --radius:14px; --radius-sm:9px;
  --sidebar:232px; --player:92px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
  --hover:rgba(255,255,255,.05); --row-line:rgba(255,255,255,.045); --track:#363a45;
  --pill-line-hover:#3a3f4b; --menu-bg:#1f222b; --menu-line:#30343f;
  --toast-bg:#2a2e38; --toast-text:#eceef3; --player-bg:rgba(18,19,24,.96); --glass:rgba(22,24,30,.72);
  --np-fade-top:rgba(12,13,16,.2); --np-fade-bot:rgba(12,13,16,.85); --np-filter:blur(60px) saturate(1.3) brightness(.45);
  --banner-bg:#3a2a10; --banner-text:#ffd892; --vu-top:#ffd892; --thumb:#fff; --disc:#2a2d36; --disc-2:#16181e;
}
/* Light theme. Applied via <html data-theme="light"> (set from Settings → Appearance). */
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#f5f6f8; --bg-2:#eceef2; --panel:#ffffff; --panel-2:#eef0f4; --line:#dfe2e8;
  --text:#16181d; --text-2:#545b68; --text-3:#858c99;
  --accent:#b46400; --accent-ink:#ffffff; --accent-soft:rgba(180,100,0,.12);
  --good:#1f9d5c; --warn:#a86b00; --bad:#c9302c;
  --hover:rgba(0,0,0,.045); --row-line:rgba(0,0,0,.06); --track:#d3d7de;
  --pill-line-hover:#c3c8d1; --menu-bg:#ffffff; --menu-line:#e2e5ea;
  --toast-bg:#1c1f27; --toast-text:#f3f4f7; --player-bg:rgba(255,255,255,.94); --glass:rgba(255,255,255,.78);
  --np-fade-top:rgba(245,246,248,.72); --np-fade-bot:rgba(245,246,248,.96); --np-filter:blur(70px) saturate(1.2) brightness(1.15);
  --banner-bg:#fff1d6; --banner-text:#6b4200; --vu-top:#f0b04a; --thumb:#ffffff; --disc:#c9cdd5; --disc-2:#eef0f4;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.fill{fill:currentColor;stroke:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--sidebar) 1fr;grid-template-rows:1fr var(--player);height:100vh}
aside{grid-row:1;grid-column:1;background:var(--bg-2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
main{grid-row:1;grid-column:2;overflow:auto;position:relative;min-height:0;scroll-behavior:smooth}
.player{grid-row:2;grid-column:1/3}
body.on-now .app{grid-template-rows:1fr 0}
body.on-now .player{display:none}
body.on-now .side-np{display:none!important}
.vol-pop{padding:14px 16px;min-width:0;width:220px}
.vol-pop input{width:100%}

/* ---------- sidebar ---------- */
.brand{display:flex;align-items:center;gap:10px;padding:20px 20px 14px}
.brand .disc{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle,var(--accent) 0 3px,#0000 4px),repeating-radial-gradient(circle,var(--disc) 0 1px,var(--disc-2) 1px 3px);box-shadow:0 0 0 1px var(--line) inset}
.brand.playing .disc{animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.brand b{font:700 18px/1 var(--display);letter-spacing:.02em}
.brand small{display:block;color:var(--text-3);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.search{margin:4px 14px 10px;position:relative}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 34px;outline:none;transition:border-color .15s}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-3)}
nav{display:flex;flex-direction:column;padding:4px 10px;gap:2px}
nav button{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--text-2);font-weight:500;text-align:left}
nav button:hover{background:var(--panel);color:var(--text)}
nav button.on{background:var(--accent-soft);color:var(--accent)}
.side-np{margin:auto 12px 10px;border-radius:var(--radius);overflow:hidden;background:var(--panel);display:none;cursor:pointer}
.side-np img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.device{border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-2)}
.device .dot{width:8px;height:8px;border-radius:50%;background:var(--text-3);flex:none}
.device.found .dot{background:var(--good);box-shadow:0 0 0 3px rgba(76,207,138,.15)}
.device.scanning .dot{background:var(--warn);animation:pulse 1s infinite}
.device.notfound .dot{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
.device .grow{flex:1;min-width:0}
.device .grow div:first-child{color:var(--text);font-weight:600}
.device code{font:11px var(--mono);color:var(--text-3)}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--text-2);transition:background .15s,color .15s}
.iconbtn:hover{background:var(--panel-2);color:var(--text)}
.iconbtn.on{color:var(--accent)}
.iconbtn[disabled]{opacity:.35;pointer-events:none}

/* ---------- views ---------- */
.view{padding:28px 36px 48px;max-width:1400px;margin:0 auto;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
h1{font:700 30px/1.15 var(--display);margin:0 0 4px;letter-spacing:-.01em}
h2{font:650 18px/1.2 var(--display);margin:28px 0 12px}
.sub{color:var(--text-2);margin:0 0 20px}
.toolbar{display:flex;align-items:center;gap:10px;margin:0 0 18px;flex-wrap:wrap}
.toolbar .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--text-2);font-weight:500;font-size:13px;transition:all .15s}
.pill:hover{color:var(--text);border-color:var(--pill-line-hover)}
.pill.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:650}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line);font-weight:550}
.filter{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-width:220px;outline:none}
.filter:focus{border-color:var(--accent)}
.empty{color:var(--text-3);padding:40px 0;text-align:center}
.spinner{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}

/* grid of cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:22px 18px}
.card{cursor:pointer;min-width:0}
.card .art{position:relative;border-radius:var(--radius-sm);overflow:hidden;aspect-ratio:1;background:var(--panel)}
.card .art img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .3s}
.card .art img.ok{opacity:1}
.card .play{position:absolute;right:10px;bottom:10px;width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;opacity:0;transform:translateY(6px);transition:all .18s;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.card:hover .play,.card:focus-within .play{opacity:1;transform:none}
.card .t{font-weight:600;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{color:var(--text-2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph{position:absolute;inset:0;display:grid;place-items:center;font:700 44px var(--display);color:rgba(255,255,255,.85)}
.ph svg{width:40%;height:40%;opacity:.35}

/* artist tiles */
.letters{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 18px}
.letters button{width:28px;height:28px;border-radius:7px;color:var(--text-2);font-weight:600;font-size:12px}
.letters button:hover{background:var(--panel);color:var(--accent)}
.letters button[disabled]{opacity:.25}
.alpha-head{font:700 13px var(--display);color:var(--accent);letter-spacing:.1em;margin:22px 0 10px;scroll-margin-top:16px}
.artist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.artist{display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;cursor:pointer}
.artist:hover{background:var(--panel)}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 16px var(--display);color:#fff;flex:none}
.artist span{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* track list */
.tracks{width:100%;border-collapse:collapse;table-layout:fixed}
.tracks td{padding:9px 10px;border-bottom:1px solid var(--row-line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tracks tr{cursor:default}
.tracks tr:hover td{background:var(--hover)}
.tracks td.n{width:56px;color:var(--text-3);text-align:right;font:12px var(--mono)}
.tracks td.a{width:96px;text-align:right;padding-right:4px}
.tracks td.dim{color:var(--text-2);width:28%}
.tracks tr .rowbtn{opacity:0}
.tracks tr:hover .rowbtn,.tracks tr:focus-within .rowbtn{opacity:1}
.tracks tr.now td{color:var(--accent)}
.tracks .title{font-weight:550}
.tracks .num-play{display:none}
.tracks tr:hover .num-txt{display:none}
.tracks tr:hover .num-play{display:inline-grid}
.rowbtn{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:50%;color:var(--text-2)}
.rowbtn:hover{background:var(--panel-2);color:var(--text)}
.rowbtn svg{width:17px;height:17px}

/* hero (album / artist header) */
.hero{display:flex;gap:28px;align-items:flex-end;margin-bottom:26px}
.hero .art{width:220px;height:220px;border-radius:var(--radius);overflow:hidden;background:var(--panel);flex:none;box-shadow:0 18px 50px rgba(0,0,0,.5);position:relative}
.hero .art img{width:100%;height:100%;object-fit:cover}
.hero .kicker{text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--text-3);font-weight:600}
.hero h1{font-size:40px;margin:6px 0 8px}
.hero .meta{color:var(--text-2);margin-bottom:18px}
.hero .meta a{color:var(--text);font-weight:600}
.hero .meta a:hover{color:var(--accent)}

/* now playing */
.np{position:relative;min-height:100%;overflow:hidden}
.np-bg{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:var(--np-filter);transform:scale(1.1);opacity:0;transition:opacity .8s, background-image .8s}
.np-bg.ok{opacity:1}
.np-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--np-fade-top),var(--np-fade-bot))}
.np-inner{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(16px,3vw,40px);align-items:center;padding:clamp(16px,3vw,40px);max-width:1180px;margin:0 auto}
/* the cover scales with the window (both width and height) and never dominates the page */
.np-art{width:min(clamp(110px,22vw,300px),36vh)}
.np-art{aspect-ratio:1;border-radius:18px;overflow:hidden;background:var(--panel);box-shadow:0 30px 80px rgba(0,0,0,.6);flex:none;position:relative}
.np-art img{width:100%;height:100%;object-fit:cover;display:block}
.np-info{flex:1;min-width:0}
.np-source{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2);font-weight:600;margin-bottom:14px}
.np-source .eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.np-source .eq i{width:3px;background:var(--accent);border-radius:1px;height:30%}
.playing .np-source .eq i{animation:eq 1s ease-in-out infinite}
.np-source .eq i:nth-child(2){animation-delay:-.3s!important}
.np-source .eq i:nth-child(3){animation-delay:-.6s!important}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
.np-title{font:750 clamp(20px,2.6vw,40px)/1.08 var(--display);letter-spacing:-.02em;margin:0 0 8px;word-break:break-word}
.np-line{font-size:clamp(14px,1.3vw,18px);color:var(--text-2);margin:2px 0}
.np-line a{color:var(--text)}
.np-line a:hover{color:var(--accent)}
.np-seek{margin-top:clamp(12px,2vh,24px);max-width:680px}
.np-times{display:flex;justify-content:space-between;font:12px var(--mono);color:var(--text-3);margin-top:8px}
.np-controls{display:flex;align-items:center;gap:clamp(6px,1.2vw,16px);margin-top:clamp(8px,1.6vh,18px);flex-wrap:wrap;max-width:680px}
.np-controls .grow{flex:1}
.surprise-btn .dot{fill:currentColor;stroke:none}
.surprise-btn.rolling svg{animation:roll .6s ease}
@keyframes roll{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.surprise-btn.rolling svg{animation:none}}
.np-controls .vol{width:clamp(110px,14vw,180px)}
.big-play{width:clamp(48px,4.4vw,60px);height:clamp(48px,4.4vw,60px);border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:transform .12s}
.big-play:hover{transform:scale(1.05)}
.big-play svg{width:28px;height:28px}
.np-controls .iconbtn{width:40px;height:40px}
.np-controls .iconbtn svg{width:22px;height:22px}
.np-vu{display:block;width:min(280px,100%);height:52px;margin-top:clamp(10px,1.6vh,16px);transition:opacity .4s}
.np-vu.quiet{opacity:0}.np-vu.off{display:none}
.np-vu svg{display:block;width:100%;height:100%;overflow:hidden}
.np-vu .vu-top{stop-color:var(--vu-top);stop-opacity:.95}.np-vu .vu-bot{stop-color:var(--accent);stop-opacity:.12}
.np-vu .vu-line{fill:none;stroke:var(--vu-top);stroke-width:1.5;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.np-extra{margin-top:20px;color:var(--text-3);font-size:13px}
.np-upnext{grid-column:1/-1;margin-top:0;background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);padding:14px 10px 8px;backdrop-filter:blur(8px)}
.np-upnext:empty{display:none}
.np-upnext .head{display:flex;align-items:center;justify-content:space-between;padding:0 8px 8px}
.np-upnext .head b{font:650 12px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--text-2)}
.np-upnext .head a{font-size:12.5px;color:var(--text-2)}
.np-upnext .head a:hover{color:var(--accent)}
.np-upnext ol{list-style:none;margin:0;padding:0}
.np-upnext li{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px}
.np-upnext li:hover{background:var(--hover)}
.np-upnext li .n{width:18px;text-align:right;color:var(--text-3);font:12px var(--mono)}
.np-upnext li .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-upnext li .rowbtn{opacity:0}
.np-upnext li:hover .rowbtn,.np-upnext li:focus-within .rowbtn{opacity:1}
.np-upnext .more{padding:6px 8px 4px;font-size:12.5px;color:var(--text-3)}

/* range sliders */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--accent) var(--p),var(--track) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--thumb);margin-top:-5px;box-shadow:0 1px 4px rgba(0,0,0,.45);opacity:0;transition:opacity .15s}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus::-webkit-slider-thumb{opacity:1}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--track)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff}
input[type=range][disabled]{opacity:.35;cursor:default}

/* ---------- player bar ---------- */
.player{background:var(--player-bg);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(220px,1fr) minmax(360px,1.4fr) minmax(220px,1fr);align-items:center;padding:0 20px;gap:20px}
.pl-now{display:flex;align-items:center;gap:14px;min-width:0;cursor:pointer}
.pl-art{width:58px;height:58px;border-radius:8px;overflow:hidden;background:var(--panel);flex:none;position:relative}
.pl-art img{width:100%;height:100%;object-fit:cover;display:block}
.pl-text{min-width:0}
.pl-text .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-text .s{color:var(--text-2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-center{display:flex;flex-direction:column;align-items:center;gap:4px}
.pl-buttons{display:flex;align-items:center;gap:14px}
.pl-play{width:40px;height:40px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;transition:transform .12s}
.pl-play:hover{transform:scale(1.06)}
.pl-seek{display:flex;align-items:center;gap:10px;width:100%;font:11px var(--mono);color:var(--text-3)}
.pl-seek span{width:40px;text-align:center}
.pl-right{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.vol{display:flex;align-items:center;gap:8px;width:170px}
.out-btn{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;color:var(--text-2);max-width:190px}
.out-btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.out-btn.sonos{color:var(--accent);border-color:var(--accent)}

/* ---------- popovers / menus / modal / toast ---------- */
.menu{position:fixed;z-index:50;min-width:220px;max-height:60vh;overflow:auto;background:var(--menu-bg);border:1px solid var(--menu-line);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.35);padding:6px;animation:pop .12s ease}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:8px;text-align:left;color:var(--text)}
.menu button:hover{background:var(--hover)}
.menu button.on{color:var(--accent)}
.menu button[disabled]{opacity:.4;pointer-events:none}
.menu .sep{height:1px;background:var(--menu-line);margin:6px 4px}
.menu .lbl{padding:8px 12px 4px;font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:grid;place-items:center;animation:fade .15s}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(420px,92vw);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal h3{margin:0 0 14px;font:650 17px var(--display)}
.modal input{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
.modal input:focus{border-color:var(--accent)}
.modal .row{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(var(--player) + 18px);transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-text);padding:10px 18px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:70;font-weight:500;animation:pop .15s}
.banner{position:sticky;top:0;z-index:5;margin:0;padding:10px 36px;background:var(--banner-bg);color:var(--banner-text);font-weight:500;display:flex;gap:12px;align-items:center}
.banner button{text-decoration:underline}

/* playlists layout */
.split{display:grid;grid-template-columns:260px 1fr;gap:28px;align-items:start}
.plist{display:flex;flex-direction:column;gap:2px;position:sticky;top:0}
.plist button{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;text-align:left;color:var(--text-2)}
.plist button:hover{background:var(--panel);color:var(--text)}
.plist button.on{background:var(--panel-2);color:var(--text)}
.plist small{color:var(--text-3)}

/* radio */
.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.preset{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);cursor:pointer;text-align:left;transition:border-color .15s}
.preset:hover{border-color:var(--accent)}
.preset .num{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 13px var(--mono);flex:none}
.preset span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:550}
.dir{display:flex;flex-direction:column;gap:2px;max-width:760px}
.dir button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;text-align:left}
.dir button:hover{background:var(--panel)}
.dir button .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--text-3);margin-bottom:10px;font-size:13px}

/* settings */
.settings{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:18px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.box h3{margin:0 0 12px;font:650 15px var(--display)}
.set{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid var(--row-line)}
.set:first-of-type{border-top:0}
.set .lab{color:var(--text-2)}
.seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{white-space:nowrap;padding:5px 12px;border-radius:999px;font-size:12.5px;color:var(--text-2)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:650}
.switch{width:42px;height:24px;border-radius:999px;background:var(--track);position:relative;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(18px)}
.tone{display:flex;align-items:center;gap:10px;width:190px}
.tone output{font:12px var(--mono);width:26px;text-align:right;color:var(--text-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.kv dt{color:var(--text-3)}
.kv dd{margin:0}

/* artwork finder */
.modal.wide{width:min(880px,94vw);max-height:90vh;display:flex;flex-direction:column;padding:0;overflow:hidden}
.af-head{display:flex;gap:16px;align-items:center;padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.af-cur{width:64px;height:64px;border-radius:8px;overflow:hidden;background:var(--bg-2);position:relative;flex:none}
.af-cur img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.af-head h3{margin:0}
.af-head .s{color:var(--text-2);font-size:13px}
.af-head .x{margin-left:auto}
.af-q{display:flex;gap:8px;padding:14px 22px;flex-wrap:wrap}
.af-q input{flex:1;min-width:160px;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none}
.af-q input:focus{border-color:var(--accent)}
.af-body{overflow:auto;padding:4px 22px 18px;flex:1;min-height:220px}
.af-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.af-tile{position:relative;text-align:left;border-radius:10px;padding:0;background:none}
.af-tile .im{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg-2);position:relative;border:2px solid transparent;transition:border-color .12s}
.af-tile:hover .im{border-color:var(--accent)}
.af-tile img{width:100%;height:100%;object-fit:cover;display:block}
.af-tile .badge{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.72);color:#fff;font-size:10.5px;font-weight:650;padding:3px 7px;border-radius:999px;letter-spacing:.02em}
.af-tile .best{position:absolute;right:6px;top:6px;background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:999px}
.af-tile .cap{font-size:12px;color:var(--text-2);margin-top:6px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.af-tile .busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.6)}
.af-tile .busy .spinner{margin:0}
.af-foot{display:flex;gap:10px;align-items:center;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap}
.af-foot input[type=url]{flex:1;min-width:200px;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none}
.af-note{color:var(--text-3);font-size:12px;margin:6px 0 12px}
.progress{height:6px;border-radius:6px;background:var(--track);overflow:hidden;max-width:420px;margin:10px 0 4px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.hero .art.editable{cursor:pointer}
.reason{position:absolute;left:8px;top:8px;z-index:2;font-size:10.5px;font-weight:650;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.75);color:#fff}
.reason.r-missing{background:#5a1f22;color:#ffc9c7}
.reason.r-placeholder{background:#4a3410;color:#ffd892}
.reason.r-lowres{background:#1d3550;color:#cfe3ff}
.pill b{font-weight:700;opacity:.7;margin-left:2px}
.hero .art.editable::after{content:"Change artwork";position:absolute;inset:auto 0 0 0;z-index:2;padding:8px;text-align:center;font-size:12px;font-weight:600;background:linear-gradient(transparent,rgba(0,0,0,.75));opacity:0;transition:opacity .15s}
.hero .art.editable:hover::after{opacity:1}


/* CD ripping */
nav button{position:relative}
.nav-dot{position:absolute;top:8px;left:30px;width:8px;height:8px;border-radius:50%;background:var(--accent);display:none}
.nav-dot.on{display:block}
.toast .toast-act{margin-left:10px;font-weight:700;color:var(--accent);text-decoration:underline}
.cd-wrap{display:grid;grid-template-columns:minmax(160px,260px) minmax(0,1fr);gap:28px;align-items:start}
.cd-cover{position:relative;aspect-ratio:1;border-radius:var(--radius);overflow:hidden;background:var(--panel);box-shadow:0 14px 40px rgba(0,0,0,.35)}
.cd-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cd-status{position:sticky;top:8px;z-index:3;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin:0 0 18px;font-weight:550}
.cd-status.busy{border-color:var(--accent)}
.cd-status .spinner{margin:0;width:16px;height:16px}
.cd-status{flex-wrap:wrap}.cd-status .cd-txt{flex:1;min-width:0}.cd-status .cd-pct{font-variant-numeric:tabular-nums;color:var(--muted)}
.cd-bar{flex-basis:100%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}.cd-bar i{display:block;height:100%;background:var(--accent);transition:width .6s}
.cd-matches{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.cd-match{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);text-align:left;max-width:280px}
.cd-match b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:250px}
.cd-match small{color:var(--text-3)}
.cd-match.on{border-color:var(--accent);background:var(--accent-soft)}
.cd-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.cd-fields label,.cd-tracks label{display:block;font-size:12px;color:var(--text-3);margin-bottom:4px}
.cd-in{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none}
.cd-in:focus{border-color:var(--accent)}
.cd-tracks ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.cd-tracks li{display:grid;grid-template-columns:28px 1fr;align-items:center;gap:8px}
.cd-tracks li span{font:12px var(--mono);color:var(--text-3);text-align:right}
@media (max-width:700px){ .cd-wrap{grid-template-columns:1fr} .cd-cover{max-width:220px} .cd-fields{grid-template-columns:1fr} }

/* search results */
.results-section{margin-bottom:8px}

/* ---------- narrower desktops ---------- */
@media (max-width:1100px){
  .player{grid-template-columns:minmax(180px,1fr) minmax(300px,1.3fr) auto}
  .player .vol input{display:none}
  .player .vol{width:auto}
  .out-btn{max-width:150px}
}
@media (max-height:620px){
  .np-art{width:min(clamp(100px,18vw,220px),30vh)}
  .np-vu,.np-extra{display:none}
}
/* ---------- tablets ---------- */
@media (max-width:900px){
  :root{--sidebar:72px; --topbar:58px}
  .brand b,.brand small,nav button span,.device .grow,.side-np{display:none}
  nav button{justify-content:center}
  /* search moves to a bar across the top of the content */
  .search{position:fixed;top:0;left:var(--sidebar);right:0;margin:0;padding:10px 16px;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
  .search svg{left:28px}
  main{padding-top:var(--topbar)}
  .np{min-height:calc(100% - 0px)}
  .np-seek{margin-inline:auto}
  .player{grid-template-columns:1fr auto auto;gap:12px;padding:0 14px}
  .pl-right .vol{display:none}
  .split{grid-template-columns:1fr}
  .plist{position:static}
  .view{padding:20px}
  .hero{flex-direction:column;align-items:flex-start}
}
/* ---------- phones ---------- */
@media (max-width:700px){
  :root{--player:68px; --tabbar:60px}
  .app{grid-template-columns:1fr;grid-template-rows:1fr var(--player) var(--tabbar);height:100dvh}
  body.on-now .app{grid-template-rows:1fr 0 var(--tabbar)}
  .np-inner{grid-template-columns:1fr;justify-items:center;text-align:center}
  .np-controls{justify-content:center}
  .np-controls .grow{display:none}
  .np-controls .vol{width:100%;max-width:320px;order:10}
  main{grid-column:1;grid-row:1}
  .player{grid-column:1;grid-row:2;grid-template-columns:1fr auto auto;padding:0 10px;gap:8px}
  aside{grid-column:1;grid-row:3;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .brand,.device{display:none}
  nav{flex-direction:row;justify-content:space-around;width:100%;padding:6px 4px}
  nav button{flex:1;padding:10px 0}
  .search{left:0}
  .search svg{left:28px}
  /* compact player: art + title, play/next, output */
  .pl-art{width:46px;height:46px}
  .pl-center{flex-direction:row}
  .pl-seek,#shuffleBtn,#prevBtn,#sortBtn,#surpriseBtn{display:none}
  .pl-buttons{gap:6px}
  .out-btn{padding:8px;border-radius:50%}
  .out-btn span{display:none}
  /* now playing */
  .np-inner{padding:16px 16px 24px;gap:16px}
  .np-art{width:min(56vw,30vh)}
  .np-title{font-size:26px;margin-bottom:8px}
  .np-line{font-size:16px}
  .np-seek{margin-top:20px;width:100%}
  .np-controls{gap:10px;margin-top:14px}
  /* lists and grids */
  .view{padding:16px 16px 28px}
  h1{font-size:26px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}
  .artist-grid{grid-template-columns:1fr}
  .letters button{width:26px;height:30px}
  .hero{gap:16px}
  .hero .art{width:160px;height:160px}
  .hero h1{font-size:28px}
  .tracks td.dim{display:none}
  .toolbar .filter{min-width:0;flex:1 1 100%}
  .settings{grid-template-columns:1fr}
  .set{flex-wrap:wrap}
  .toast{bottom:calc(var(--player) + var(--tabbar) + 14px);max-width:92vw;text-align:center}
  .modal.wide{max-height:86dvh}
  .af-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* touch screens have no hover: keep row buttons and card play buttons visible */
@media (hover:none){
  .tracks tr .rowbtn,.np-upnext li .rowbtn{opacity:1}
  .tracks .num-txt{display:none!important}
  .tracks .num-play{display:inline-grid!important}
  .card .play{opacity:1;transform:none;width:36px;height:36px}
}

/* ================= Layout & Look (Settings) =================
   Driven by attributes/classes on <html>: data-art, data-menu, data-density, hide-*. */
/* artwork size on Now Playing (m = the default sizing above) */
:root[data-art="s"] .np-art{width:min(clamp(90px,14vw,190px),26vh)}
:root[data-art="l"] .np-art{width:min(clamp(150px,30vw,440px),50vh)}
:root[data-art="xl"] .np-art{width:min(clamp(170px,40vw,600px),64vh)}
@media (max-width:700px){
  :root[data-art="s"] .np-art{width:min(38vw,22vh)}
  :root[data-art="l"] .np-art{width:min(74vw,42vh)}
  :root[data-art="xl"] .np-art{width:min(88vw,52vh)}
}
/* show / hide pieces */
:root.hide-meter .np-vu{display:none!important}
:root.hide-upnext .np-upnext{display:none!important}
:root.hide-player{--player:0px}
:root.hide-player .player{display:none!important}
:root.hide-surprise .surprise-btn{display:none!important}
:root.hide-sideart .side-np{display:none!important}
:root.hide-glow .np-bg{display:none!important}
/* density */
:root[data-density="compact"] .tracks td{padding:5px 10px}
:root[data-density="compact"] .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:16px 12px}
:root[data-density="compact"] .card .t{margin-top:6px;font-size:13px}
:root[data-density="compact"] .artist{padding:4px 8px}
:root[data-density="compact"] .avatar{width:34px;height:34px;font-size:13px}
:root[data-density="compact"] nav button{padding:6px 12px}
:root[data-density="compact"] .view{padding-top:18px;padding-bottom:28px}
:root[data-density="compact"] .np-upnext li{padding:3px 8px}
:root[data-density="compact"] .hero .art{width:170px;height:170px}
:root[data-density="compact"] .hero h1{font-size:32px}
@media (max-width:700px){ :root[data-density="compact"] .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px} }
/* menu along the top (phones always use bottom tabs) */
@media (min-width:701px){
  :root[data-menu="top"]{--sidebar:0px}
  :root[data-menu="top"] .app{grid-template-columns:1fr;grid-template-rows:auto 1fr var(--player)}
  :root[data-menu="top"] body.on-now .app{grid-template-rows:auto 1fr 0}
  :root[data-menu="top"] aside{grid-row:1;grid-column:1;flex-direction:row;align-items:center;gap:10px;border-right:0;border-bottom:1px solid var(--line);padding:0 12px}
  :root[data-menu="top"] main{grid-row:2;grid-column:1;padding-top:0}
  :root[data-menu="top"] .player{grid-row:3;grid-column:1}
  :root[data-menu="top"] .brand{padding:10px 6px;order:0}
  :root[data-menu="top"] .brand small{display:none}
  :root[data-menu="top"] nav{flex-direction:row;flex:1;order:1;padding:6px 0;gap:2px;overflow-x:auto;scrollbar-width:none}
  :root[data-menu="top"] nav button{padding:8px 12px;white-space:nowrap}
  :root[data-menu="top"] .search{order:2;position:relative;left:auto;top:auto;right:auto;margin:0;padding:0;border:0;background:none;width:clamp(150px,20vw,260px);z-index:auto}
  :root[data-menu="top"] .search svg{left:10px}
  :root[data-menu="top"] .side-np{display:none!important}
  :root[data-menu="top"] .device{order:3;border-top:0;padding:0}
  :root[data-menu="top"] .device .grow{display:none}
  :root[data-menu="top"] .nav-dot{top:5px;left:24px}
}
@media (min-width:701px) and (max-width:1100px){
  :root[data-menu="top"] nav button span,:root[data-menu="top"] .brand b{display:none}
  :root[data-menu="top"] .brand .disc+div{display:none}
}
/* menu as tabs along the bottom (like phones), search across the top */
@media (min-width:701px){
  :root[data-menu="bottom"]{--sidebar:0px; --tabbar:62px; --topbar:58px}
  :root[data-menu="bottom"] .app{grid-template-columns:1fr;grid-template-rows:1fr var(--player) var(--tabbar)}
  :root[data-menu="bottom"] body.on-now .app{grid-template-rows:1fr 0 var(--tabbar)}
  :root[data-menu="bottom"] main{grid-row:1;grid-column:1;padding-top:var(--topbar)}
  :root[data-menu="bottom"] .player{grid-row:2;grid-column:1}
  :root[data-menu="bottom"] aside{grid-row:3;grid-column:1;flex-direction:row;border-right:0;border-top:1px solid var(--line)}
  :root[data-menu="bottom"] .brand,:root[data-menu="bottom"] .device,:root[data-menu="bottom"] .side-np{display:none!important}
  :root[data-menu="bottom"] nav{flex-direction:row;justify-content:space-around;width:100%;padding:4px 8px;max-width:900px;margin:0 auto}
  :root[data-menu="bottom"] nav button{flex:1;flex-direction:column;justify-content:center;gap:2px;padding:6px 0;font-size:11.5px}
  :root[data-menu="bottom"] nav button span{display:inline}
  :root[data-menu="bottom"] .nav-dot{top:4px;left:calc(50% + 8px)}
  :root[data-menu="bottom"] .search{position:fixed;top:0;left:0;right:0;margin:0;padding:10px 16px;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
  :root[data-menu="bottom"] .search svg{left:28px}
  :root[data-menu="bottom"] .toast{bottom:calc(var(--player) + var(--tabbar) + 14px)}
}
/* Settings: accent swatches and the show/hide list */
.swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
.swatch{width:24px;height:24px;flex:none;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px var(--line) inset;position:relative}
.swatch.on{border-color:var(--text)}
.swatch.art{width:auto;height:26px;padding:0 10px;border-radius:999px;background:var(--bg-2);font-size:12px;color:var(--text-2);box-shadow:0 0 0 1px var(--line) inset}
.swatch.art.on{color:var(--text)}
.set .note{display:block;color:var(--text-3);font-size:12px;margin-top:2px}
.showlist{display:grid;grid-template-columns:1fr;gap:0}
.showlist label{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;color:var(--text-2);cursor:pointer;border-top:1px solid var(--row-line)}
.showlist label:first-child{border-top:0}
#layoutBox{grid-column:1/-1}
.layout-cols{display:grid;grid-template-columns:1.25fr 1fr;gap:0 40px}
@media (max-width:900px){ .layout-cols{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <div class="brand" id="brand"><div class="disc"></div><div><b>Brennan</b><small id="brandSub">B3+ Music Server</small></div></div>
    <form class="search" id="searchForm" role="search" autocomplete="off">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label class="sr" for="q">Search library</label>
      <input id="q" type="search" placeholder="Search  ( / )">
    </form>
    <nav id="nav">
      <button data-go="now"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg><span>Now Playing</span></button>

<script>
"use strict";
/* =========================================================================
   API
   ========================================================================= */
const ID = { ALBUM:1e6, TRACK:2e6, ARTIST:3e6, PLAYLIST:4e6, RADIO:5e6, PRESET:6e6 };
const ACCENTS = { amber:['#f0a43a','#b46400'], rose:['#f06292','#c2185b'], violet:['#b39dff','#6a3fc8'], blue:['#5aa9ff','#1565c0'],
                  teal:['#34d1bf','#00796b'], green:['#72d27c','#2e7d32'], red:['#ff6b6b','#c62828'] };
const SHOW_ITEMS = [ ['meter','Level meter'], ['upnext','Up next'], ['player','Player bar (other pages)'],
                     ['surprise','Surprise me button'], ['sideart','Sidebar artwork'], ['glow','Artwork glow behind Now Playing'] ];
const LAYOUT_DEFAULT = { art:'m', menu:'side', density:'comfortable', accent:'art',
                         show:{ meter:true, upnext:true, player:true, surprise:true, sideart:true, glow:true } };
function loadLayout(){
  let saved={}; try { saved = JSON.parse(localStorage.getItem('brennan.layout')||'{}') || {}; } catch {}
  return { ...LAYOUT_DEFAULT, ...saved, show:{ ...LAYOUT_DEFAULT.show, ...(saved.show||{}) } };
}
let L = loadLayout();
applyFixedAccent();
const kind = id => id>=1e6&&id<2e6?'album':id>=2e6&&id<3e6?'track':id>=3e6&&id<4e6?'artist':id>=4e6&&id<5e6?'playlist':id>=5e6&&id<6e6?'radio':'other';

// Build a query string for the unit. Order matters: `string`/`name` must be last.
function qs(cmd, params={}, tail){
  let s = cmd;
  for (const [k,v] of Object.entries(params)){
    s += v===true ? '&'+k : '&'+k+'='+encodeURIComponent(v);
  }
  s += '&time=' + Date.now();
  if (tail) for (const [k,v] of Object.entries(tail)) s += '&'+k+'='+encodeURIComponent(v);
  return s;
}
async function api(cmd, params, tail){
  const r = await fetch('/api?' + qs(cmd, params, tail));
  if (!r.ok) { const e = new Error('api '+cmd+' '+r.status); e.status=r.status; throw e; }
  const t = await r.text();
  try { return JSON.parse(t); } catch { return t; }
}
// The Brennan's IDs are positions in its index and can be renumbered when the library
// changes (renames, moves, rips, artwork). Everything cached is tied to the launcher's
// library "generation" (S.gen) and thrown away when it changes.
try { localStorage.removeItem('brennan.artBust'); } catch {}
const artURL = id => '/api?getAlbumArt&id='+id+'&g='+(S.gen||'0');
// Ask the launcher to re-read the library now; applies the new generation if it changed.
async function refreshLibrary(){
  try { const j = await fetch('/local/library-refresh',{method:'POST'}).then(r=>r.json()); await onGeneration(j.gen); } catch {}
}
// Find an album's current ID by name (+artist). Returns null if not found.
async function findAlbumId(name, artist){
  const list = await api('search',{artists:'N',tracks:'N',radio:'N',video:'N',offset:0,count:20000},{string:''});
  S.cache.albums = list;
  const n=x=>clean(x).trim().toLowerCase();
  const hit = list.find(a=>n(a.album)===n(name) && (!artist || n(a.artist)===n(artist))) || list.find(a=>n(a.album)===n(name));
  return hit ? hit.id : null;
}
async function findArtistId(name){
  const list = await api('search',{albums:'N',tracks:'N',radio:'N',video:'N',offset:0,count:20000},{string:''});
  S.cache.artists = list;
  const hit = list.find(a=>clean(a.artist).trim().toLowerCase()===clean(name).trim().toLowerCase());
  return hit ? hit.id : null;
}
// Before changing an album/artist, make sure the ID still points at what's on screen.
async function stillSame(id, expectName){
  try {
    const d = await api(kind(id)==='artist'?'artistDetails':'albumDetails',{id});
    if (clean(d.name).trim().toLowerCase() === clean(expectName).trim().toLowerCase()) return true;
  } catch {}
  toast('The Brennan’s library changed — refreshing. Please try again.');
  await refreshLibrary(); return false;
}
async function onGeneration(gen){
  if (!gen || gen==='0' || gen===S.gen) { if (gen && gen!=='0') S.gen=gen; return; }
  const first = !S.gen || S.gen==='0';
  S.gen = gen;
  S.cache = {artists:null, albums:null, playlists:null, presets:null};
  S.artVersion++; S.lastTrackId=null;
  if (first) return;
  // Re-point the page we're on at the item's new ID, then redraw it.
  const r = S.route;
  try {
    if (r.name==='album' && r.key){ const nid = await findAlbumId(r.key.name, r.key.artist); if (nid) r.id = nid; else return go('albums',{},false); }
    if (r.name==='artist' && r.key){ const nid = await findArtistId(r.key.name); if (nid) r.id = nid; else return go('artists',{},false); }
  } catch {}
  try { history.replaceState(null,'','#'+r.name+(r.id?'/'+r.id:'')); } catch {}
  if (!document.querySelector('.scrim')) render();
}
const sonosParam = () => ({sonos: S.output});

/* =========================================================================
   State
   ========================================================================= */
const S = {
  status:null, sonosStatus:null, output: +(localStorage.getItem('brennan.output')||0),
  lastTrackId:null, artVersion:0, seeking:false, volDrag:false, muteFrom:null,
  cache:{ artists:null, albums:null, playlists:null, presets:null },
  route:{ name:'now' }, history:[], device:null,
};
// The output is remembered by Sonos room NAME: the Brennan's list of rooms changes order
// (and grows) over time, so a stored position can quietly point at a different room.
try{ S.outputName = localStorage.getItem('brennan.outputName') || ''; localStorage.removeItem('brennan.output'); }catch{ S.outputName=''; }
S.output = 0;
// Some rooms appear more than once (e.g. a speaker plus a Port with the same room name), so a
// choice is stored as name + which active entry of that name it was ("Den#1").
function sonosChoices(st){
  const names = st?.sonos || [], active = st?.sonosActive || [], count = {}, out = [];
  names.forEach((n,i)=>{ if (!active[i]) return; const k = count[n] = (count[n]||0); count[n]++; out.push({name:n, k, index:i+1}); });
  return out.map(c=>({...c, key:c.name+'#'+c.k, label: count[c.name]>1 ? `${c.name} (${c.k+1})` : c.name}));
}
function resolveOutput(st){
  if (!S.outputName) { S.output = 0; return; }
  const ch = sonosChoices(st);
  const hit = ch.find(c=>c.key===S.outputName) || ch.find(c=>c.name===S.outputName.replace(/#\d+$/,''));
  S.output = hit ? hit.index : 0;
  S.outputLabel = hit ? hit.label : '';
}

/* =========================================================================
   Helpers
   ========================================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = sec => { sec=Math.max(0,Math.round(+sec||0)); const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); };
const cleanTrack = n => String(n||'').replace(/^\d{1,3}[\s.\-_]+/, '');
const trackNo = n => { const m=String(n||'').match(/^(\d{1,3})[\s.\-_]/); return m?+m[1]:''; };
const clean = s => String(s||'').replace(/<[^>]*>/g,'');
function hue(str){ let h=0; for (const c of String(str)) h=(h*31+c.charCodeAt(0))>>>0; return h%360; }
function avatar(name){ const h=hue(name); return `<div class="avatar" style="background:linear-gradient(135deg,hsl(${h} 45% 38%),hsl(${(h+40)%360} 50% 22%))">${esc(initials(name))}</div>`; }
function initials(n){ n=String(n||'?').replace(/^the\s+/i,''); const w=n.split(/\s+/).filter(Boolean); return ((w[0]||'?')[0]+((w[1]||'')[0]||'')).toUpperCase(); }
function placeholder(name){ const h=hue(name||'x'); return `<div class="ph" style="background:linear-gradient(135deg,hsl(${h} 35% 26%),hsl(${(h+50)%360} 40% 14%))"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg></div>`; }
function setRangeFill(el){ const p = (el.value-el.min)/(el.max-el.min)*100; el.style.setProperty('--p', p+'%'); }
let toastTimer;
function toast(msg, action, ms){ document.querySelectorAll('.toast').forEach(t=>t.remove()); const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  if (action){ const b=document.createElement('button'); b.textContent=action.label; b.className='toast-act'; b.onclick=()=>{ t.remove(); action.run(); }; t.append(' ', b); }
  document.body.append(t); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.remove(), ms || (action?6000:2200)); }
const icon = {
  up:'<svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  play:'<svg class="i fill" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>',
  pause:'<svg class="i fill" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>',
  more:'<svg class="i fill" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  queue:'<svg class="i" viewBox="0 0 24 24"><path d="M4 6h12M4 12h12M4 18h7M18 15v6M15 18h6"/></svg>',
  trash:'<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  back:'<svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  radio:'<svg class="i" viewBox="0 0 24 24"><path d="M5 9a10 10 0 0 1 14 0M8 12a6 6 0 0 1 8 0"/><circle cx="12" cy="16" r="2"/></svg>',
  folder:'<svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  star:'<svg class="i" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  plus:'<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  chev:'<svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="m9 6 6 6-6 6"/></svg>',
};

/* lazy album art */
const artObserver = new IntersectionObserver(entries=>{
  for (const e of entries){ if (!e.isIntersecting) continue; const img=e.target; artObserver.unobserve(img); img.src=img.dataset.src; }
},{rootMargin:'400px'});
function artImg(id, eager){
  return `<img alt="" ${eager?`src="${artURL(id)}"`:`data-src="${artURL(id)}"`} onload="this.classList.add('ok')" onerror="this.remove()">`;
}
function hydrateArt(root){ root.querySelectorAll('img[data-src]').forEach(i=>artObserver.observe(i)); }

/* =========================================================================
   Menus & modals
   ========================================================================= */
function closeMenus(){ document.querySelectorAll('.menu').forEach(m=>m.remove()); }
let menuJustOpened=false;
function openMenu(anchor, items){
  closeMenus(); menuJustOpened=true; setTimeout(()=>menuJustOpened=false);
  const m = document.createElement('div'); m.className='menu'; m.setAttribute('role','menu');
  for (const it of items){
    if (it==='-'){ m.insertAdjacentHTML('beforeend','<div class="sep"></div>'); continue; }
    if (it.label){ m.insertAdjacentHTML('beforeend',`<div class="lbl">${esc(it.label)}</div>`); continue; }
    const b=document.createElement('button'); b.setAttribute('role','menuitem');
    b.innerHTML = (it.icon||'') + `<span>${esc(it.text)}</span>`;
    if (it.on) b.classList.add('on'); if (it.disabled) b.disabled=true;
    b.onclick = e => { e.stopPropagation(); closeMenus(); it.run(); };
    m.append(b);
  }
  document.body.append(m);
  const r = anchor.getBoundingClientRect(), mw=m.offsetWidth, mh=m.offsetHeight;
  let x = Math.min(r.right - mw, innerWidth - mw - 8); x=Math.max(8,x);
  let y = r.bottom + 6; if (y+mh > innerHeight-8) y = Math.max(8, r.top - mh - 6);
  m.style.left=x+'px'; m.style.top=y+'px';
  m.querySelector('button')?.focus();
}
document.addEventListener('click', e=>{ if (!menuJustOpened && !e.target.closest('.menu')) closeMenus(); });
document.addEventListener('keydown', e=>{ if (e.key==='Escape') { closeMenus(); document.querySelector('.scrim')?.remove(); } });

function prompt2(title, placeholderText, okText='Save', value=''){
  return new Promise(res=>{
    const sc=document.createElement('div'); sc.className='scrim';
    sc.innerHTML=`<form class="modal"><h3>${esc(title)}</h3><input value="${esc(value)}" placeholder="${esc(placeholderText)}"><div class="row"><button type="button" class="btn ghost">Cancel</button><button class="btn">${esc(okText)}</button></div></form>`;
    document.body.append(sc);
    const f=sc.querySelector('form'), inp=sc.querySelector('input');
    inp.focus(); inp.select();
    sc.querySelector('.ghost').onclick=()=>{sc.remove();res(null)};
    sc.onclick=e=>{ if(e.target===sc){sc.remove();res(null)} };
    f.onsubmit=e=>{e.preventDefault(); const v=inp.value.trim(); sc.remove(); res(v||null)};
  });
}

/* =========================================================================
   Actions
   ========================================================================= */
async function play(id, label){
  try { await api('playID', {[id]:true, ...sonosParam()}); if (label) toast('Playing '+label); setTimeout(poll,350); }
  catch { toast('Couldn’t reach the Brennan'); }
}
/* Surprise me: pick a random track from the whole library and play it. Track IDs are
   2,000,000 + position, so any number below the library's track count is a real track. */
let surpriseInfo = { gen:null, tracks:0, at:0 }, surpriseBusy = false;
async function surprise(){
  if (surpriseBusy) return; surpriseBusy = true;
  document.querySelectorAll('.surprise-btn').forEach(b=>{ b.classList.remove('rolling'); void b.offsetWidth; b.classList.add('rolling'); });
  try {
    if (surpriseInfo.gen !== S.gen || !surpriseInfo.tracks || Date.now()-surpriseInfo.at > 300000) {
      const info = await api('getWebInfo');
      surpriseInfo = { gen:S.gen, tracks: Math.max(0, (+info.tracks||0) - (+info.USBTracks||0)), at:Date.now() };
    }
    const n = surpriseInfo.tracks; if (!n) return toast('No songs on the Brennan to pick from');
    const current = +(S.status?.trackid||0);
    let id; for (let i=0;i<5;i++){ id = ID.TRACK + Math.floor(Math.random()*n); if (id!==current) break; }
    await api('playID', {[id]:true, ...sonosParam()});
    toast('Surprise! Picking a song…', {label:'Another', run:surprise});
    setTimeout(async()=>{
      await poll();
      if (S.output===0 && S.status && +S.status.trackid===id && S.status.track)
        toast(`Surprise: ${cleanTrack(clean(S.status.track))} — ${clean(S.status.artist||'')}`, {label:'Another', run:surprise}, 8000);
    }, 900);
  } catch { toast('Couldn’t reach the Brennan'); }
  finally { setTimeout(()=>{ surpriseBusy=false; }, 700); }
}
async function queue(id, label){
  const beforeQ = S.output>0 ? await sonosQueue().catch(()=>null) : null;
  try { await api('queueID', {id, ...sonosParam()}); } catch { return toast('Couldn’t add to queue'); }
  S.cache.playlists=null;
  const what = label ? `“${cleanTrack(label)}”` : 'That';
  // A Sonos room plays from its own queue on the speaker (the one the Sonos app shows);
  // queueID adds to the end of it. The launcher reads that queue straight from the speaker.
  if (S.output>0) return sonosQueued(what, beforeQ);
  // On the Brennan, the Queue playlist holds the track that's playing (first) plus what's
  // waiting. Queueing while nothing is playing from the Queue starts that track straight away.
  let q = null; try { q = await getQueue(); } catch {}
  try { S.status = await api('status'); } catch {}
  const up = upcoming(q);
  if (!q) toast(`${what} added to Queue`);
  else if (!up.length && S.status?.playlist==='Queue') toast(`${what} is playing now`);
  else toast(`${what} added — ${up.length} track${up.length===1?'':'s'} up next`);
  refreshUpNext(true);
}
let sonosPosBusy=false;
async function fetchSonosPos(room){
  if (sonosPosBusy) return; sonosPosBusy=true;
  try {
    const r = await fetch('/local/sonos/position?room='+encodeURIComponent(room));
    const j = r.ok ? await r.json() : null;
    S.sonosPos = j ? { ...j, room, at: performance.now() } : { room, failed:true, at: performance.now() };
    updateUI();
  } catch { S.sonosPos = { room, failed:true, at: performance.now() }; }
  finally { sonosPosBusy=false; }
}
// elapsed/total for the bar: Brennan status, or the Sonos speaker's own position (ticking locally)
function trackTimes(st){
  if (S.output>0) {
    const p=S.sonosPos;
    if (!p || p.failed || p.room!==sonosRoom()) return { dur:0, into:0, seekable:false };
    const into = p.into + (p.playing && S.sonosStatus?.playing ? (performance.now()-p.at)/1000 : 0);
    return { dur:p.duration, into: Math.min(p.duration||Infinity, into), seekable: p.duration>0 };
  }
  const dur=+st.duration||0;
  return { dur, into:+st.timeIntoTrack||0, seekable: dur>0 };
}
/* ---- Sonos room queues (read and edited through the launcher, see sonos.py) ---- */
const sonosRoom = () => (S.status?.sonos||[])[S.output-1] || '';
async function sonosQueue(){
  const r = await fetch('/local/sonos/queue?room='+encodeURIComponent(sonosRoom()));
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error||('HTTP '+r.status));
  return j;
}
async function sonosAct(action, body){
  const r = await fetch('/local/sonos/'+action, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({room:sonosRoom(), ...body})});
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error||('HTTP '+r.status));
  return j;
}
const sonosUpcoming = q => q && q.fromQueue ? q.items.filter(t=>t.n>q.current) : (q?.items||[]);
// after queueID: the new tracks are at the end of the room's queue
async function sonosQueued(what, before, playNext){
  await new Promise(r=>setTimeout(r,500));
  let q=null; try { q = await sonosQueue(); } catch {}
  const room = outputName();
  if (!q) { toast(`${what} added to ${room}’s Sonos queue`); return refreshUpNext(true); }
  const added = before ? Math.max(0, q.total - before.total) : 0;
  const next = q.current + 1;
  const start = q.total - added + 1;
  const moveUp = async () => {
    if (!added || !q.fromQueue || start <= next) return toast(`${what} is already next`);
    try { await sonosAct('move', {start, count:added, before:next}); toast(`${what} plays next on ${room}`); }
    catch(e){ toast('Couldn’t move it: '+e.message); }
    refreshUpNext(true);
  };
  if (playNext) return moveUp();
  const ahead = sonosUpcoming(q).length - added;
  toast(ahead>0 ? `${what} added to ${room} — after ${ahead} other track${ahead===1?'':'s'}` : `${what} added to ${room} — up next`,
        ahead>0 && added ? {label:'Play next', run:moveUp} : null, ahead>0 ? 7000 : 0);
  refreshUpNext(true);
}
async function playNext(id, label){
  const what = label ? `“${cleanTrack(label)}”` : 'That';
  const before = await sonosQueue().catch(()=>null);
  try { await api('queueID', {id, ...sonosParam()}); } catch { return toast('Couldn’t add to queue'); }
  return sonosQueued(what, before, true);
}

// Queue items still to come: skip the first entry when it's the track playing right now.
function upcoming(q){
  const items = q?.items || [];
  const st = S.status || {};
  if (items.length && st.playlist==='Queue' && String(items[0].id)===String(st.trackid)) return items.slice(1);
  return items;
}
// Current contents of the Brennan's "Queue" playlist (null if it doesn't exist).
async function getQueue(){
  const pls = await api('listplaylists');
  const qi = pls.findIndex(p=>p.name==='Queue');
  if (qi < 0) return null;
  const items = await api('listplaylist',{id:ID.PLAYLIST+qi});
  return {index: qi, items: Array.isArray(items) ? items : []};
}
let upNextBusy=false, upNextAt=0, upNextSig='';
async function refreshSonosUpNext(box, force){
  if (upNextBusy || (!force && Date.now()-upNextAt < 5000)) return;
  upNextBusy=true; upNextAt=Date.now();
  let q=null, err=null; try { q = await sonosQueue(); } catch(e){ err=e; } finally { upNextBusy=false; }
  const el = $('#npUpNext'); if (!el || S.output<=0) return;
  const room = esc(outputName());
  if (err) {
    const sig='sonos-err'; if (upNextSig===sig) return; upNextSig=sig;
    el.innerHTML = `<div class="head"><b>Up next on ${room}</b></div><div class="more">Couldn’t read ${room}’s Sonos queue (${esc(err.message)}).</div>`; return;
  }
  const items = sonosUpcoming(q);
  const sig = JSON.stringify(['sonos', q.fromQueue, q.current, !!S.sonosPos?.shuffle, items.map(t=>t.n+t.title)]);
  if (sig === upNextSig) return; upNextSig = sig;
  if (!q.fromQueue) { el.innerHTML = q.total ? `<div class="head"><b>${room}’s queue</b></div><div class="more">${room} is playing something else right now (not its queue). ${q.total} track${q.total===1?'':'s'} waiting in its queue.</div>` : ''; return; }
  if (!items.length) { el.innerHTML=''; return; }
  const shown = items.slice(0, innerHeight>800 ? 10 : 6);
  el.innerHTML = `<div class="head"><b>${S.sonosPos?.shuffle?'In the queue on':'Up next on'} ${room}</b><span class="more" style="padding:0">${S.sonosPos?.shuffle?'Shuffle is on — plays in random order':'Sonos queue'}</span></div>
    <ol>${shown.map((t,i)=>`<li data-i="${i}"><span class="n">${i+1}</span><span class="t">${esc(cleanTrack(t.title))}${t.artist?` <small style="color:var(--text-3)">· ${esc(t.artist)}</small>`:''}</span>
      ${i>0?`<button class="rowbtn" data-u title="Play next">${icon.up}</button>`:''}<button class="rowbtn" data-p title="Play now">${icon.play}</button><button class="rowbtn" data-x title="Remove from queue">${icon.trash}</button></li>`).join('')}</ol>
    ${items.length>shown.length?`<div class="more">+ ${items.length-shown.length} more</div>`:''}`;
  el.querySelectorAll('li').forEach(li=>{
    const t=items[+li.dataset.i];
    // positions shift as tracks finish, so re-read the queue and find the track again by position+title
    const locate = async()=>{ const now=await sonosQueue(); const hit=now.items.find(x=>x.n===t.n && x.title===t.title) || now.items.find(x=>x.n>now.current && x.title===t.title); return [now, hit]; };
    const act = fn => async()=>{ try { await fn(); } catch(e){ toast('Sonos: '+e.message); } setTimeout(()=>{ refreshUpNext(true); poll(); }, 400); };
    li.querySelector('[data-p]').onclick = act(async()=>{ const [,h]=await locate(); if(!h) throw new Error('that track already played'); await sonosAct('play',{n:h.n}); toast('Playing '+t.title); });
    li.querySelector('[data-x]').onclick = act(async()=>{ const [,h]=await locate(); if(!h) throw new Error('that track already played'); await sonosAct('remove',{n:h.n}); toast('Removed '+t.title); });
    const u=li.querySelector('[data-u]'); if (u) u.onclick = act(async()=>{ const [now,h]=await locate(); if(!h) throw new Error('that track already played'); await sonosAct('move',{start:h.n, count:1, before:now.current+1}); toast(t.title+' plays next'); });
  });
}
async function refreshUpNext(force){
  if (L.show.upnext===false) return;
  const box = $('#npUpNext'); if (!box) return;
  if (S.output>0) return refreshSonosUpNext(box, force);
  if (upNextBusy || (!force && Date.now()-upNextAt < 5000)) return;
  upNextBusy=true; upNextAt=Date.now();
  let q=null; try { q = await getQueue(); } catch {} finally { upNextBusy=false; }
  const el = $('#npUpNext'); if (!el) return;
  const items = upcoming(q);
  const sig = JSON.stringify([q?.index, items, S.status?.playlist, S.status?.trackid]);
  if (sig === upNextSig) return; upNextSig = sig;
  if (!items.length) { el.innerHTML=''; return; }
  const fromQueue = S.status?.playlist === 'Queue';
  const shown = items.slice(0, innerHeight>800 ? 10 : 6);
  el.innerHTML = `<div class="head"><b>${fromQueue?'Up next':'In your Queue'}</b><a href="#" id="unAll">See all</a></div>
    <ol>${shown.map((t,i)=>`<li data-i="${i}"><span class="n">${i+1}</span><span class="t">${esc(cleanTrack(clean(t.name)))}</span>
      <button class="rowbtn" data-p title="Play now">${icon.play}</button><button class="rowbtn" data-x title="Remove from Queue">${icon.trash}</button></li>`).join('')}</ol>
    ${items.length>shown.length?`<div class="more">+ ${items.length-shown.length} more</div>`:''}`;
  el.querySelector('#unAll').onclick = e => { e.preventDefault(); S.route && (S.sectionRoute.playlists = {name:'playlists', sel:q.index}); lastPlaylistName.set('Queue'); openSection('playlists'); };
  el.querySelectorAll('li').forEach(li=>{
    const i=+li.dataset.i, t=items[i];
    li.querySelector('[data-p]').onclick = async()=>{ await api('startPlaylist',{playlist:ID.PLAYLIST+q.index, id:t.id, ...sonosParam()}).catch(()=>{}); toast('Playing '+cleanTrack(clean(t.name))); setTimeout(poll,400); setTimeout(()=>refreshUpNext(true),1200); };
    li.querySelector('[data-x]').onclick = async()=>{
      // re-check the position first: the Queue shifts as tracks start playing
      const now = await getQueue().catch(()=>null);
      const skip = now && now.items.length && S.status?.playlist==='Queue' && String(now.items[0].id)===String(S.status.trackid) ? 1 : 0;
      const pos = now ? now.items.findIndex((x,k)=>k>=skip && x.id===t.id) : -1;
      if (pos<0) { toast('That track already left the Queue'); return refreshUpNext(true); }
      await api('deletePlaylistIndex',{playlist:now.index, index:pos}).catch(()=>{});
      toast('Removed from Queue'); refreshUpNext(true);
    };
  });
}
async function getPlaylists(force){
  if (!S.cache.playlists || force) { const r = await api('listplaylists'); S.cache.playlists = r; return r; }
  return S.cache.playlists;
}
async function addToPlaylistMenu(anchor, id, label){

}
function itemMenu(anchor, id, label, extra=[]){

   ========================================================================= */
const main = $('#main');
// Each sidebar section works like a tab: it remembers the last page you were on inside it
// (e.g. the artist you had open) and the scroll position of each page. Clicking the section
// you're already in takes you back to its top-level list.
const SECTIONS = ['now','artists','albums','playlists','radio','cd','settings'];
const sectionOf = name => SECTIONS.includes(name) ? name : null;
S.section = 'now';
S.sectionRoute = {};     // section -> last route object
S.sectionHistory = {};   // section -> back-stack for that section
S.scrollMem = {};        // route key -> scrollTop
const routeKey = r => r.name + (r.id ? '/'+r.id : '') + (r.q ? '?'+r.q : '');
function saveScroll(){ if (S.route) S.scrollMem[routeKey(S.route)] = main.scrollTop; }
function go(name, args={}, push=true){
  saveScroll();
  const sec = sectionOf(name);
  if (sec && sec !== S.section) { S.sectionHistory[S.section] = S.history; S.history = []; S.section = sec; }
  else if (push && S.route) S.history.push(S.route);
  S.route = {name, ...args};
  document.body.classList.toggle('on-now', name==='now');
  if (S.section) S.sectionRoute[S.section] = S.route;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.go===S.section));
  main.scrollTop = 0;
  const want = S.scrollMem[routeKey(S.route)] || 0;
  Promise.resolve(render()).then(()=>{ if (want) requestAnimationFrame(()=>{ main.scrollTop = want; }); });
  try{ history.replaceState(null,'','#'+name+(args.id?'/'+args.id:'')) }catch{}
}
function render(){
  const r=S.route;
  return ({now:viewNow, artists:viewArtists, albums:viewAlbums, artist:viewArtist, album:viewAlbum,
    playlists:viewPlaylists, radio:viewRadio, cd:viewCD, settings:viewSettings, search:viewSearch, missingart:viewMissingArt}[r.name]||viewNow)(r);
}
function backBtn(){ return S.history.length ? `<button class="pill" onclick="goBack()">${icon.back}Back</button>` : ''; }
function goBack(){ const r=S.history.pop(); if (r) go(r.name, r, false); }
function openSection(sec){
  if (sec === S.section) {            // already here: back to the section's top-level list
    if (S.route.name === sec) { main.scrollTop = 0; S.scrollMem[sec] = 0; return; }   // already at the top level: scroll up
    S.history = [];
    return go(sec, sec==='playlists' ? {sel:S.route.sel} : {}, false);
  }
  saveScroll();
  S.sectionHistory[S.section] = S.history;
  const r = S.sectionRoute[sec];
  S.section = sec; S.history = S.sectionHistory[sec] || [];
  if (r) go(r.name, r, false); else go(sec, {}, false);
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>openSection(b.dataset.go));

      ? clean(a.album).localeCompare(clean(b.album))

  main.innerHTML = `<div class="view">
    <h1>Albums</h1><p class="sub">${list.length} albums</p>
    <div class="toolbar"><input class="filter" id="flt" placeholder="Filter albums or artists">
      <button class="pill" id="missingBtn">Fix artwork</button>

    </div>

  $('#missingBtn').onclick = () => go('missingart');
}

      catch(e){ toast(e.message); } }},

    }}]);

// Remember the chosen playlist by name (indexes shift when playlists are added/removed).
const lastPlaylistName = { get(){ try{ return localStorage.getItem('brennan.playlist'); }catch{ return null; } },
                           set(n){ try{ localStorage.setItem('brennan.playlist', n); }catch{} } };
let plTimer = null, plSig = '';
async function viewPlaylists({sel, quiet}={}){
  if (!quiet) loading();
  let pls; try { pls = await getPlaylists(true); } catch { return quiet ? null : offlineView(); }
  if (sel == null) sel = S.route.sel;
  if (sel == null) { const n = lastPlaylistName.get(); const i = pls.findIndex(x=>x.name===n); sel = i>=0 ? i : 0; }
  if (sel>=pls.length) sel=0;
  S.route.sel = sel;
  const p = pls[sel];
  if (p) lastPlaylistName.set(p.name);
  let items=[]; try { items = await api('listplaylist',{id:ID.PLAYLIST+sel}); } catch {}
  if (S.route.name!=='playlists') return;
  const sig = JSON.stringify([pls, sel, items]);
  if (quiet && sig === plSig) return;          // nothing changed
  plSig = sig;
  const keepScroll = quiet ? main.scrollTop : null;
  main.innerHTML = `<div class="view"><h1>Playlists</h1><p class="sub">${pls.length} playlists</p>
    <div class="split">
      <div class="plist">${pls.map((x,i)=>`<button data-i="${i}" class="${i===sel?'on':''}"><span>${esc(x.name)}</span><small>${x.length}</small></button>`).join('')}
        <button id="newPl" style="color:var(--accent)"><span>+ New playlist</span></button></div>
      <div>
        <div class="toolbar"><h2 style="margin:0">${esc(p?.name||'')}</h2><span class="spacer"></span>
          <button class="btn" id="plPlay" ${items.length?'':'disabled'}>${icon.play}Play</button>
          <button class="pill" id="plMore">${icon.more}</button></div>
        ${S.output>0 && p?.name==='Queue' ? `<div class="af-note" style="margin:0 0 12px;color:var(--warn)">You're playing on <b>${esc(outputName())}</b>. Tracks you queue now go to that Sonos speaker's own queue, which the Brennan can't list. Switch the output (bottom right) to Brennan speakers to use this Queue.</div>` : ''}
        ${items.length?`<table class="tracks" id="pt">${items.map((t,i)=>`<tr data-i="${i}" data-id="${t.id}">
          <td class="n"><span class="num-txt">${i+1}</span><button class="rowbtn num-play" title="Play from here">${icon.play}</button></td>
          <td class="title">${esc(cleanTrack(clean(t.name)))}</td>
          <td class="dim" style="width:90px">${kind(t.id)}</td>
          <td class="a"><button class="rowbtn" data-m title="More">${icon.more}</button></td></tr>`).join('')}</table>`:'<div class="empty">This playlist is empty. Add tracks or albums from the library with ⋯ → Add to playlist.</div>'}
      </div></div></div>`;
  main.querySelectorAll('.plist button[data-i]').forEach(b=>b.onclick=()=>{ S.route.sel=+b.dataset.i; lastPlaylistName.set(pls[+b.dataset.i].name); viewPlaylists({sel:+b.dataset.i}); });
  if (keepScroll != null) main.scrollTop = keepScroll;
  markNowPlaying();
  // The Brennan removes played tracks from the Queue (and other clients may edit playlists)
  // without telling anyone, so re-check while this page is open.
  clearInterval(plTimer);
  plTimer = setInterval(()=>{ if (S.route.name!=='playlists' || document.hidden) { if (S.route.name!=='playlists') clearInterval(plTimer); return; }
    if (!document.querySelector('.menu,.scrim')) viewPlaylists({sel:S.route.sel, quiet:true}); }, 5000);
  $('#newPl').onclick=async()=>{ const n=await prompt2('New playlist','Playlist name','Create'); if(!n) return; await api('newPlaylist',{},{name:n}); const after=await getPlaylists(true); viewPlaylists({sel:Math.max(0,after.findIndex(x=>x.name===n))}); };
  $('#plPlay').onclick=()=>play(ID.PLAYLIST+sel, p.name);
  $('#plMore').onclick=e=>openMenu(e.currentTarget,[
    {text:'Play', icon:icon.play, run:()=>play(ID.PLAYLIST+sel,p.name)},
    {text:'Rename…', run:async()=>{ const n=await prompt2('Rename playlist','Name','Rename',p.name); if(n){ await api('renameID',{id:ID.PLAYLIST+sel},{name:n}); viewPlaylists({sel}); } }},
  ]);
  main.querySelectorAll('#pt tr').forEach(tr=>{
    const i=+tr.dataset.i, id=+tr.dataset.id, name=tr.querySelector('.title').textContent;
    const start=()=>{ api('startPlaylist',{playlist:ID.PLAYLIST+sel, id, ...sonosParam()}); toast('Playing '+name); setTimeout(poll,350); };
    tr.ondblclick=start; tr.querySelector('.num-play').onclick=start;
    tr.querySelector('[data-m]').onclick=e=>openMenu(e.currentTarget,[
      {text:'Play from here', icon:icon.play, run:start},
      {text:'Remove from playlist', icon:icon.trash, run:async()=>{ await api('deletePlaylistIndex',{playlist:sel,index:i}); toast('Removed'); viewPlaylists({sel}); }},
      ...(kind(id)==='album'?[{text:'Go to album',run:()=>go('album',{id})}]:[]),
    ]);
  });
}

          return;

/* ---- Artwork ---- */
async function localJSON(url, opts){
  const r = await fetch(url, opts); let j={}; try { j = await r.json(); } catch {}
  if (!r.ok) { const e=new Error(j.error||('HTTP '+r.status)); e.body=j; throw e; }
  return j;
}

// flow = {list:[{id,album,artist}], index} when stepping through albums missing art
function openArtFinder(item, flow, onDone){
  document.querySelector('.scrim')?.remove();
  const sc=document.createElement('div'); sc.className='scrim';
  const pos = flow ? `<span class="pill" style="pointer-events:none">${flow.index+1} of ${flow.list.length}</span>` : '';
  sc.innerHTML = `<div class="modal wide" role="dialog" aria-label="Album artwork">
    <div class="af-head"><div class="af-cur" id="afCur">${placeholder(item.album)}<img src="${artURL(item.id)}" onerror="this.remove()" alt=""></div>
      <div style="min-width:0"><h3>${esc(item.album)}</h3><div class="s">${esc(item.artist)}</div></div>
      <div class="x" style="display:flex;gap:8px;align-items:center">${pos}${flow?'<button class="pill" id="afSkip">Skip</button>':''}<button class="iconbtn" id="afClose" title="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div></div>
    <form class="af-q" id="afForm"><input id="afArtist" value="${esc(item.artist)}" placeholder="Artist"><input id="afAlbum" value="${esc(item.album)}" placeholder="Album"><button class="btn ghost">Search</button></form>
    <div class="af-body"><div class="af-note" id="afNote">Searching Apple Music, Deezer and MusicBrainz…</div><div class="af-grid" id="afGrid"><div class="spinner"></div></div></div>
    <div class="af-foot">
      <input type="url" id="afUrl" placeholder="…or paste an image URL">
      <button class="pill" id="afUseUrl">Use URL</button>
      <label class="pill" style="cursor:pointer">Choose file…<input type="file" id="afFile" accept="image/jpeg,image/png" hidden></label>
    </div></div>`;
  document.body.append(sc);
  const close=()=>{ sc.remove(); S.artFlowActive=false; };
  sc.onclick=e=>{ if(e.target===sc) close(); };
  $('#afClose').onclick=close;
  const next = async () => {
    if (!flow) { close(); onDone&&onDone(); return; }
    const n = flow.index+1;
    if (n >= flow.list.length) { S.artFlowActive=false; close(); toast('That was the last one'); onDone&&onDone(); return; }
    let it = flow.list[n];
    if (flow.gen !== S.gen) {               // library renumbered since the list was made
      const nid = await findAlbumId(it.album, it.artist).catch(()=>null);
      if (nid) it = {...it, id:nid};
    }
    openArtFinder(it, {...flow, index:n, gen:S.gen}, onDone);
  };
  if (flow) { S.artFlowActive = true; if (!flow.gen) flow.gen = S.gen; }
  if ($('#afSkip')) $('#afSkip').onclick=next;

  const applied = async (res) => {
    await refreshLibrary();
    if (flow) flow.fixed = (flow.fixed||0)+1;
    const px = res.size ? ` (${res.size[0]}×${res.size[1]})` : '';
    toast('Artwork updated'+px);
    document.querySelectorAll(`.card[data-id="${item.id}"] img, .card[data-id="${item.id}"] .art img`).forEach(im=>{ im.src=artURL(item.id); });
    setTimeout(next, 450);
  };
  const fail = (e) => {
    if (e.body?.error==='library_changed') { toast(e.body.message); close(); refreshLibrary(); return; }
    toast(e.message || 'Couldn’t set artwork');
  };

  async function useUrl(url, tile){
    if (tile) tile.querySelector('.im').insertAdjacentHTML('beforeend','<div class="busy"><div class="spinner"></div></div>');
    sc.querySelectorAll('.af-tile').forEach(t=>t.disabled=true);
    try { applied(await localJSON('/local/art-set',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:item.id,url,expect:item.album})})); }
    catch(e){ fail(e); tile?.querySelector('.busy')?.remove(); sc.querySelectorAll('.af-tile').forEach(t=>t.disabled=false); }
  }
  $('#afUseUrl').onclick=()=>{ const u=$('#afUrl').value.trim(); if(u) useUrl(u); };
  $('#afFile').onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    if (f.size>25e6) return toast('That file is too big');
    toast('Sending '+f.name+'…');
    try { applied(await localJSON('/local/art-upload?id='+item.id+'&expect='+encodeURIComponent(item.album),{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:f})); } catch(err){ fail(err); }
  };

  async function runSearch(){
    const grid=$('#afGrid'), note=$('#afNote');
    grid.innerHTML='<div class="spinner"></div>'; note.textContent='Searching Apple Music, Deezer and MusicBrainz…';
    let j;
    try { j = await localJSON('/local/art-search?artist='+encodeURIComponent($('#afArtist').value)+'&album='+encodeURIComponent($('#afAlbum').value)); }
    catch(e){ grid.innerHTML=''; note.textContent='Search failed: '+e.message; return; }
    const errs=Object.keys(j.errors||{});
    note.textContent = (j.results.length ? `${j.results.length} candidates for “${j.query.album}”. Click one to use it.` : `Nothing found for “${j.query.album}”. Try a shorter album name, or paste a URL.`)
      + (errs.length ? `  (${errs.join(', ')} didn’t respond)` : '');

// The Brennan reports the disc in `status` (cdloaded, cdstatus, discid, cddbmatches, background)

S.cd = { key:null, matches:[], sel:0, edits:{}, art:null, sent:false };
function isRipping(st){ return /rip/i.test(st?.cdstatus||'') || /rip/i.test(st?.background||''); }
function cdStatusChanged(prev, st){
  const dot = $('#cdDot'); if (dot) dot.classList.toggle('on', !!st.cdloaded);
  if (!prev) return;
  if (!prev.loaded && st.cdloaded && S.route.name!=='cd')
    toast('CD inserted', {label:'Rip it', run:()=>openSection('cd')});
  if (prev.loaded && !st.cdloaded && S.cd.sent && !prev.ripping) { S.cd.sent=false; toast('The Brennan ejected the disc instead of ripping it', {label:'Details', run:showRipLog}, 12000); }
  if (prev.ripping && !isRipping(st)) { toast('Rip finished — the album is in your library'); S.cd.sent=false; refreshLibrary(); setTimeout(applyPendingCdArt, 4000); }
  if (S.route.name==='cd' && (prev.loaded !== !!st.cdloaded || (S.cd.key && S.cd.key !== cdKey(st)))) viewCD();

const cdKey = st => (st.discid||'') + '|' + (st.cddbmatches??'');

function cdProgress(st){
